# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ACTIVE since 2026-07-10 — this file runs on every push and PR to `main`.   │
# │                                                                            │
# │ It was parked as `ci.yml.deferred` under a 2026-06-15 operator decision to │
# │ defer cross-platform CI to near project completion. That milestone came,   │
# │ the operator activated the matrix, and the file was renamed — but the      │
# │ banner saying "DEFERRED — NOT ACTIVE" rode along unchanged and was still   │
# │ here on 2026-11-09, four months and several hundred runs later, on the     │
# │ very file producing them (bug-log `#188`).                                 │
# └──────────────────────────────────────────────────────────────────────────┘
#
# cockpit-cross-platform v0.1 — First CI in the repo (ADR feature D8).
#
# Matrix: { ubuntu-latest, macos-latest, windows-latest }
# Scope:
#   - All legs: build the ui crate (cockpit + fixtures) + test the non-UI workspace crates.
#   - ubuntu-latest: headless winit via xvfb-run + the Q5-researched apt deps
#     (validate on first CI run — see docs/runbooks/cockpit-cross-platform.md §Q5).
#     Runs the ui headless smokes. Visual baselines are compiled OUT on Linux by
#     the #![cfg(target_os="macos")] source gate (ADR-0057 D2) — no --skip filter needed.
#   - macos-latest: full cargo test -p ui including all 56 visual baselines (canonical gate).
#   - windows-latest: build + non-visual cargo test -p ui (D5 scope).
#
# TLS: reqwest is now rustls-tls (D1) — no libssl-dev/pkg-config needed on any leg.
# tokio-tungstenite still uses native-tls for WebSocket connections (data crate);
# on Ubuntu that requires libssl-dev. On Windows it uses schannel (no extra setup).
#
# Keep it minimal — no caching, no release pipeline, no matrix-fanciness at v0.1.
# The goal is a green build + non-visual test floor, not a release pipeline.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual trigger. Without it, a cancelled run can be restarted ONLY by
  # re-running it or by pushing a commit, and both are writes to the Actions
  # API — which the dev box cannot make: its unauthenticated `gh` READS runs
  # fine (60/hour by IP) but every write returns HTTP 401. Added 2026-11-09,
  # after four concurrent runs were cancelled and starting a fresh one would
  # otherwise have required inventing a commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The forecast crate's checkpoint anchors (crates/forecast/checkpoints/
          # anchors/*.safetensors) are LFS-tracked; without lfs:true the runner
          # gets pointer stubs and the checkpoint-anchor tests fail (first-CI
          # shakeout finding, run #2 2026-07-12).
          lfs: true

      # ── Ubuntu: repo governance gates (fail fast, before any compile) ──────
      # The constitutional invariants — AD-2 anchors byte-immutability and the
      # ADR-0082 story↔trace↔CHANGELOG triad — were previously enforced ONLY by
      # agent discipline (2026-07-27 adversarial-review hardening; bug-log #66
      # showed what discipline-only enforcement ships). One leg suffices: these
      # check repo STATE, not platform behavior. Both scripts are stdlib-only.
      - name: Governance gates (anchors + spec-lint)
        if: matrix.os == 'ubuntu-latest'
        # `shell: bash` is LOAD-BEARING, not style (bug-log #84, 2026-08-15).
        # GitHub's default `run:` shell is `bash -e {0}` — WITHOUT `pipefail` — so
        # `verify_anchors.sh | tail -1` exited with *tail's* status (always 0) and
        # this gate could not fail. AD-2's only remote enforcement was inert from
        # activation until now. `shell: bash` makes Actions use
        # `bash --noprofile --norc -eo pipefail {0}`, so the pipeline's failing head
        # propagates. Demonstrated: `bash -e -c 'false | tail -1'` → 0 versus
        # `bash -eo pipefail -c 'false | tail -1'` → 1.
        # Do NOT remove this line, and do not add a `| tail`-style pipe to any other
        # gate step without it.
        shell: bash
        run: |
          bash scripts/verify_anchors.sh | tail -1
          python3 scripts/spec_lint.py
          python3 scripts/spec_lint.py --self-test
          # bug-log #154: the three verdict classifiers live in [[bin]]s, so their tests
          # re-implement them and test the copy. This pins the branch conditions on both
          # sides against a set declared in the script, and its --self-test re-measures
          # the gate's own teeth on every run rather than trusting that they are still there.
          python3 scripts/verdict_transcription_check.py
          python3 scripts/verdict_transcription_check.py --self-test
          # bug-log #163: a target whose required-features are unmet is skipped by
          # `cargo test` SILENTLY. Measured: 46 test fns across 13 targets have never
          # run in this workflow — including every candle-gated forecast test, while
          # candle-core compiles anyway (crates/backtest/Cargo.toml:63 pulls
          # forecast/candle unconditionally). This gate does not turn those features
          # on; it makes the exclusion declared and counted, printing the invisible
          # count on every run so the silence is in the log.
          python3 scripts/feature_gated_targets_check.py
          python3 scripts/feature_gated_targets_check.py --self-test

          # bug-log #179: verify_anchors.sh above asks whether each row's SHA matches a
          # committed body. It is content for TWO rows of one scenario to point at the
          # SAME body — so a re-emission that runs one invocation and writes it to two
          # rows silently merges two friction namespaces while the gate still prints
          # 119/119. Measured: the 2026-10-29 re-lock put default zero-slippage output
          # into six CANONICAL rows (a 28 pp gap against a real --sim-slippage-bps 8
          # run), and the next re-emission was about to do the mirror of it. This
          # declares the distinct-body count per scenario so neither a collapse nor a
          # split lands unseen.
          python3 scripts/anchor_namespace_collapse_check.py
          python3 scripts/anchor_namespace_collapse_check.py --self-test

          # bug-log #183 durable fix: this tool maps every in-test SHA literal to its
          # anchors.toml row, and until now it was named in this workflow only inside a
          # comment about something else — never run. The stale pin of #181 was caught by
          # a Rust test on all three legs instead. It is pure Python; it costs seconds.
          python3 scripts/check_determinism_anchors.py
          python3 scripts/check_determinism_anchors.py --self-test

          # bug-log #183: a body SHA lives in anchors.toml and is COPIED into source.
          # When #183 was filed, check_determinism_anchors.py synced five of the NINE
          # files that mirror a current anchors row, and the uncovered one holding 35
          # of them took this workflow red on all three legs. The durable fix put eight
          # of the nine under that tool (gated just above); this census pins the count
          # itself. A stale copy stops matching, so the file's mirror count drops below
          # its declared floor and this fails. Its uncovered count is DERIVED from the
          # sync tool's own file list, so it cannot go stale when that list grows.
          python3 scripts/sha_mirror_census.py
          python3 scripts/sha_mirror_census.py --self-test

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # ── Ubuntu: headless display + winit X11 deps ──────────────────────────
      # Q5 note (cockpit-cross-platform ADR D9): winit 0.30.x on Linux requires
      # an X/Wayland display for window creation even when tiny-skia renders
      # fully CPU-side. xvfb-run provides the virtual X display. The libxkb* +
      # libx11 packages are required by winit's x11rb backend.
      # libssl-dev is required by tokio-tungstenite native-tls (WebSocket, data crate).
      # VALIDATE ON FIRST CI RUN — if winit panics with "no display server",
      # add libwayland-dev or check xvfb startup. See the runbook Q5 section.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libssl-dev \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      # ── Ubuntu: clippy, which CI has never run ────────────────────────────
      #
      # CLAUDE.md states `cargo clippy -- -D warnings` MUST pass, and until now
      # nothing enforced it remotely: `grep -c clippy ci.yml` returned 0. The gap
      # was found the ordinary way — a pre-existing unused import in
      # `agent/src/activity.rs` sat in `main` because no gate looked.
      #
      # SCOPE IS DELIBERATE AND LOAD-BEARING. This is `--workspace` WITHOUT
      # `--all-targets` / `--tests`, so it lints libs and bins only. CLAUDE.md
      # records why: linting all targets links 339 integration-test binaries
      # across 17 crates — one measured cycle took 52 MINUTES and grew
      # `target/debug` to 155 GB, filling a 460 GB disk. A gate that cannot
      # finish is not a gate. Test-target lints stay a local, per-crate concern
      # (`cargo clippy -p <crate> --tests`).
      #
      # One leg only: clippy findings are not OS-specific, and three copies would
      # triple the cost for no extra signal.
      - name: Clippy (libs + bins, ubuntu only)
        if: always() && matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace -- -D warnings

      # ── All legs: build the ui crate (fixtures binary) ────────────────────
      - name: Build ui (fixtures)
        run: cargo build -p ui --bin cockpit --features fixtures

      # ── Ubuntu: the MINIMAL build (bug-log #92) ───────────────────────────
      # `crates/ui/Cargo.toml` documents `--no-default-features` as a supported
      # opt-out ("for the gallery-only bin"). NOTHING built it, so it rotted: from
      # roughly the 2026-05-25 promotion of `live` to a default feature until
      # 2026-08-22 it failed with three E0432 errors, because `state.rs`,
      # `lab/activity.rs` and `widgets/activity_tape.rs` imported the `live`-only
      # `agent` crate unconditionally. Fixed by relocating the wire types to
      # `trading_core` (ADR pending); THIS STEP is what stops it happening again.
      #
      # Cheap by design — `cargo check`, one leg, no tests. The point is coverage
      # of a build configuration, not of behaviour. A documented capability that
      # nothing exercises is the defect class this whole burn-down keeps finding.
      - name: Check ui minimal build (--no-default-features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p ui --no-default-features --features fixtures

      # ── All legs: test the non-UI workspace crates ─────────────────────────
      # Excludes `ui` because:
      #   - ubuntu/windows: visual snapshots are compiled out by the
      #     #![cfg(target_os="macos")] source gate, but headless smokes need
      #     the platform-specific step below.
      #   - macos: full ui test suite runs in a dedicated step below.
      # ── A FAILING STEP MUST NOT CANCEL THE GATES BELOW IT ────────────────
      #
      # Measured 2026-08-23: with this step red, steps 9-12 all reported
      # `skipped` — including "Test ui (full suite, macOS canonical gate)", which
      # is AD-10's canonical rendered-pixel gate. So for as long as CI was red on
      # ANY cause, the entire UI evidence base ran zero assertions on every leg,
      # and the run's summary said nothing about it.
      #
      # That is this project's recurring defect wearing a CI hat: a gate that
      # never executes is indistinguishable from a gate that passed. It is also
      # how the `leaderboard_scorecard_render` regression (bisected to 67f2a9d)
      # stayed unreported — it is a REAL failure on the canonical box that no run
      # ever reached.
      #
      # The UI steps below therefore carry `always() &&` in front of their OS
      # condition: an earlier failure no longer cancels them. A failing step still
      # fails the job — nothing is being made permissive here; the run just stops
      # hiding what else is broken.
      #
      # WHY THIS STEP IS A SCRIPT AND NOT `run: cargo test ...`
      #
      # Run logs require repo ADMIN to download (`gh run ... --log-failed` ->
      # HTTP 403 for everyone else), so a plain `cargo test` failure is visible to
      # a non-admin only as the word "failure" next to a step name. Diagnosing the
      # 2026-08-22 red run therefore took a clean-clone reproduction to learn a
      # fact one line of output already contained.
      #
      # `::error::` lines become run ANNOTATIONS, which are part of the run's
      # public metadata rather than its log. So the failing test names travel out
      # of the log and can be read without admin. `--no-fail-fast` makes that list
      # COMPLETE — the default stops at the first failing target and would have
      # hidden that one fix was not the whole fix.
      - name: Test workspace (non-ui crates)
        shell: bash
        run: scripts/ci_run_annotated.sh "workspace" cargo test --workspace --exclude ui --no-fail-fast

      # Story 6-12 — the reproducibility sample. The ONE real-data figure in this
      # repo that a second party can reproduce from a fresh clone.
      #
      # Ubuntu only: this proves reproducibility from the committed bytes, which is a
      # property of the data and the engine, not of the operating system. Running it on
      # three legs would triple the cost of the `yahoo` feature build to re-assert the
      # same fact. (If cross-OS float determinism is ever in question, that is a
      # separate, measured decision — the same one ADR-0057 D2 made for the pixel gates.)
      #
      # It needs the `yahoo` feature, which the workspace test step above does not
      # enable, and `python3` for the canonical body hash — already a prerequisite of
      # the governance-gate steps.
      #
      # AC4's whole point: without this the recipe becomes a stale document nobody runs,
      # and the day the engine drifts away from the anchor nobody finds out. Bug-log #93
      # is what that looks like when it happens unobserved.
      - name: Reproduce the sample figure (story 6-12)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "repro-sample" cargo test -p backtest --features yahoo --test reproducibility_sample_figure

      # ── backtest's other yahoo-gated target (bug-log #184) ────────────────
      #
      # bug-log #163 left three targets invisible and named the blocker for each.
      # This one needs ONLY `yahoo`, and the step above already pays for the `yahoo`
      # build of this very package, so adding it costs a test run and no compile.
      #
      # CORRECTED 2026-11-09 (bug-log #186). This block used to say the other two
      # "need `realdata`, which wants data/binance/REVISION.toml provisioned in CI —
      # a separate operator decision". BOTH halves of that are false and were when
      # written: the corpus has been tracked since 2026-09-27 (241 paths under
      # data/binance, declared `binary`, and this workflow checks out `lfs: true`),
      # and `polars` is a NON-OPTIONAL dependency of data/forecast/reports, so
      # `dep:polars` under `realdata` adds nothing to the graph that every build
      # already compiles. Measured: the two targets pass, 10 live test fns
      # (8 passed/7 ignored + 2 passed). WIRED 2026-11-09 in the two steps below,
      # once the #185 Windows verdict came back green (run 42575316185, all three
      # legs success) so this would be the only experiment riding its own run.
      #
      # What it recovers is not generic coverage. Two of its six tests,
      # `btc_default_sha_matches_anchor_69` and `eth_ticker_sha_matches_anchor_70`,
      # invoke the `run_yahoo_sma` BINARY and hash its output — a second witness that
      # RE-RUNS THE PRODUCER, which is the thing the on-disk anchor gates structurally
      # cannot do (bug-log #93, #111, and the header of
      # crates/reports/tests/strategy_anchors_unchanged.rs). Those are precisely the
      # two rows bug-log #182 re-emitted, and until this step nothing in CI re-derived
      # them. The other four pin the ALLOWED_YAHOO_TICKERS cross-crate mirror, the two
      # scenario-name formats, and the unknown-ticker exit code.
      #
      # MEASURED locally 2026-11-08 before this step was added:
      #   cargo test -p backtest --features yahoo --test run_yahoo_sma_ticker_flag
      #   -> 6 passed, 0 failed, 0 ignored, 0 filtered out, 0.80 s
      # It reads the committed 100 KB data/yahoo-sample corpus and needs no network
      # (crates/data/Cargo.toml: "yahoo" is the cache read path; "yahoo-online" is the
      # fetching one and stays out).
      #
      # Ubuntu only, for the same reason as the step above: these assert properties of
      # the data, the engine and the CLI contract, not of the operating system, and the
      # other legs would each pay a fresh `yahoo` feature build to re-assert them.
      # A SEPARATE step rather than a second --test on the step above so its CI
      # annotation carries its own label — logs are 403 here, annotations are how a
      # failure gets read.
      - name: "backtest yahoo-gated ticker-flag tests (bug-log #184)"
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "yahoo-ticker-flag" cargo test -p backtest --features yahoo --test run_yahoo_sma_ticker_flag

      # ── backtest's realdata-gated targets (bug-log #186) ──────────────────
      #
      # The last two targets bug-log #163 left invisible. Both of the blockers on
      # file for them were false (see the corrected block above), so what remained
      # was cost and evidence, and both are now measured.
      #
      # COST. On run 42575316185 — the first all-green 3-OS run — windows paced the
      # matrix at 82.5 min while ubuntu finished in 51.1, so an ubuntu-only step has
      # ~31 min of headroom before it moves the matrix wall clock at all. These two
      # spend a backtest recompile under realdata,candle,yahoo plus ~50 s of test
      # time (measured locally 2026-11-09: build 24 s; p2_verdict_rerun 21.2 s →
      # 8 passed / 0 failed / 7 ignored; threshold_sweep_readonly 22.4 s → 2 passed).
      # The second step reuses the first step's build — same feature set — and is a
      # separate step only so its annotation carries its own label, for the same
      # reason as the step above: logs are 403 here, annotations are how a failure
      # gets read.
      #
      # THE PRECONDITION IS LOAD-BEARING, not decoration. `s4_binance_2324_base_smoke`
      # SKIPs and RETURNS when data/binance/BTCUSDT is absent, so without it this
      # step could report success having measured nothing — the "gate that cannot
      # fail" shape of #135 / #161 / #186. The declared condition is 24 parquet files
      # (10 symbols × 24 months + REVISION.toml = 241 tracked paths) each over 10 KB:
      # the real files are 24.4–27.8 KB, an LFS pointer stub is ~130 B, so the size
      # floor distinguishes "checked out" from "pointer only" rather than merely
      # "present".
      #
      # WHAT THE LOCAL MEASUREMENT DOES AND DOES NOT COVER. It visits CI's data state,
      # not a richer one: data/deribit-dvol and data/yahoo-macro hold only
      # REVISION.toml on the dev box too, so `v0.dvol_regime` is DROPPED and
      # `v0.macro_riskon` runs warm-up-only in BOTH places (24 candidates ranked,
      # crowned v0.buyhold). Those absence paths are non-fatal by construction —
      # bakeoff/mod.rs returns None and logs, per #78's "never degrade a probe into a
      # stub that keeps the probe's label". The one dimension the local run does not
      # visit is the OS; s4's assertions are structural (a crowned candidate exists,
      # candidates are non-empty, the benchmark is present), not SHA-pinned, so there
      # is no platform-float surface here.
      #
      # No `| head` in these pipelines: `shell: bash` means pipefail (bug-log #84),
      # and head closing the pipe early SIGPIPEs its producer into a false failure.
      - name: "backtest realdata-gated p2 verdict rerun (bug-log #186)"
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          test -f data/binance/REVISION.toml
          n=$(find data/binance/BTCUSDT -name '*.parquet' | wc -l)
          # `wc -c` via -exec, not find's -printf: -printf is GNU-only, and a
          # precondition I cannot run on the dev box is the one unmeasured line in a
          # step that exists to be measured. This form runs on both.
          smallest=$(find data/binance/BTCUSDT -name '*.parquet' -exec wc -c {} \; | awk '{print $1}' | sort -n | sed -n '1p')
          echo "precondition: data/binance/BTCUSDT holds $n parquet files, smallest $smallest bytes"
          test "$n" -eq 24
          test "$smallest" -gt 10000
          scripts/ci_run_annotated.sh "p2-verdict-rerun" cargo test -p backtest --features realdata,candle,yahoo --test p2_verdict_rerun -- --nocapture

      - name: "backtest realdata-gated threshold-sweep read-only guard (bug-log #186)"
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "threshold-sweep-readonly" cargo test -p backtest --features realdata,candle,yahoo --test threshold_sweep_readonly

      # ── forecast's candle-gated tests (bug-log #163, operator-approved 2026-11-08) ──
      #
      # `cargo test` SKIPS a target whose `required-features` are unmet in silence:
      # no warning, no note, exit 0. The workspace step above runs with default
      # features, so until this step existed, 9 forecast test targets had NEVER run
      # in CI and nothing said so.
      #
      # The usual reason to keep an ML feature out of CI is its compile cost, and
      # that reason does not apply here: `crates/backtest/Cargo.toml:63` depends on
      # `strategy` with `features = ["forecast"]` UNCONDITIONALLY, which pulls
      # `forecast/candle`, so candle-core is compiled on every default run already
      # (17 `libcandle_core*` rlibs in a default `target/debug/deps`). CI was paying
      # for the ML backend and getting none of the tests that need it.
      #
      # A SEPARATE step rather than `--features` on the workspace run: adding a
      # feature there changes resolution for every crate in the run, and this needs
      # to add 13 targets, not perturb 300. Same shape as the yahoo step above.
      #
      # MEASURED locally 2026-11-08 before this step was added:
      #   cargo test -p forecast --features candle --no-fail-fast
      #   -> 33 targets, 191 passed, 0 failed, 18 ignored, 507 s from a cold build
      # The 18 ignored are the pre-existing long/corpus-gated ones (~487 s and
      # ~620 s forward passes); this step does not pass `--ignored`.
      #
      # Ubuntu only, for the same reason as the step above: these assert properties
      # of the model code and its checkpoints, not of the operating system, and the
      # candle build is the expensive part. `scripts/feature_gated_targets_check.py`
      # declares what each leg does and does not build, so this scope is recorded
      # rather than assumed.
      - name: "forecast candle-gated tests (bug-log #163)"
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "forecast-candle" cargo test -p forecast --features candle --no-fail-fast

      # ── Ubuntu: headless ui tests (smokes only — visual baselines not compiled) ──
      # xvfb-run provides a virtual X display for winit window creation.
      # The visual snapshot tests are compiled OUT on Linux (#![cfg(target_os="macos")])
      # so this runs only the headless smokes: headless_emulator_smoke,
      # cockpit_live_lab_run_smoke, and all other non-visual ui integration tests.
      - name: Test ui (headless, Linux)
        # `always() &&` so a failure in an EARLIER step cannot silently cancel this
        # gate — see the block above `Test workspace`.
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: xvfb-run -a scripts/ci_run_annotated.sh "ui-linux" cargo test -p ui --features fixtures --no-fail-fast

      # ── Ubuntu: skip-visibility (bug-log #66 class) ────────────────────────
      # Corpus-gated real-data tests self-skip wherever data/binance is absent
      # — in CI, always. Surface the skip count so a green run is never read as
      # "the real-data guards executed" (they run for real on the canonical box
      # only). Informational: never fails the build.
      - name: Report corpus-gated skips (informational)
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          OUT=$(xvfb-run -a cargo test -p ui --test lab_binance_divergence --test lab_binance_persist_compare -- --nocapture 2>&1 || true)
          N=$(printf '%s' "$OUT" | grep -c "\[skip\]" || true)
          echo "corpus-gated [skip] lines: $N (expected >0 in CI — the pinned corpus is machine-local; 0 + green means the corpus was unexpectedly present and the guards ran for real)"

      # ── macOS: full ui test suite including the 56 visual baselines ────────
      # This is the canonical visual regression gate (ADR-0057 D1/D2, R-NR.1).
      # The #![cfg(target_os="macos")] source gate compiles the visual tests IN
      # on macOS only; they run against the 56 committed baseline PNGs.
      - name: Test ui (full suite, macOS canonical gate)
        # `always() &&` — this is AD-10's canonical gate; it must never be skipped
        # as a side effect of an unrelated step failing.
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "ui-macos" cargo test -p ui --no-fail-fast

      # ── Windows: build + non-visual cargo test -p ui (D5 scope) ───────────
      # The windows = "=0.57.0" dep stanza (D4) makes pid_alive.rs compile.
      # Visual baselines are compiled OUT by the #![cfg(target_os="macos")] gate.
      # Interactive window UX on Windows is best-effort at v0.1 (no Windows HW
      # for manual QA); full interactive parity is a v0.2 follow-on (D5).
      - name: Test ui (non-visual, Windows)
        if: always() && matrix.os == 'windows-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "ui-windows" cargo test -p ui --features fixtures --no-fail-fast
