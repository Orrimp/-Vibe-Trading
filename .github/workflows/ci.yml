# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ACTIVE since 2026-07-10 — this file runs on every push and PR to `main`.   │
# │                                                                            │
# │ It was parked as `ci.yml.deferred` under a 2026-06-15 operator decision to │
# │ defer cross-platform CI to near project completion. That milestone came,   │
# │ the operator activated the matrix, and the file was renamed — but the      │
# │ banner saying "DEFERRED — NOT ACTIVE" rode along unchanged and was still   │
# │ here on 2026-11-09, four months and several hundred runs later, on the     │
# │ very file producing them (bug-log `#188`).                                 │
# └──────────────────────────────────────────────────────────────────────────┘
#
# cockpit-cross-platform v0.1 — first CI in the repo (ADR feature D8), narrowed
# from three legs to two on 2026-11-09 by operator decision.
#
# Matrix: { macos-latest, windows-latest }
# Scope:
#   - Both legs: build the ui crate (cockpit + fixtures) + test the non-UI
#     workspace crates.
#   - macos-latest is the CANONICAL leg: the full `cargo test -p ui` including all
#     56 visual baselines (ADR-0057 D1/D2), plus every repo-governance gate and
#     every feature-gated cargo invocation whose subject is the code rather than
#     the operating system.
#   - windows-latest: build + non-visual `cargo test -p ui` (D5 scope) + the
#     workspace test run.
#
# ── WHY ubuntu-latest IS GONE, AND WHERE ITS WORK WENT ────────────────────────
#
# The Ubuntu leg was not a third copy of the same steps. ELEVEN steps carried
# `if: matrix.os == 'ubuntu-latest'` and ran NOWHERE ELSE — among them every
# governance gate and the only clippy invocation in the repo. Deleting the leg
# without re-homing them would have removed the entire constitutional gate suite
# from CI while the matrix went on reporting green, which is the one defect shape
# this project's bug-log is mostly about. Measured per-step from run
# `42575316185`, the last all-green 3-OS run (`gh run view <id> --json jobs`
# carries per-step startedAt/completedAt and needs no credential):
#
#   step                                       ubuntu   now runs on
#   Governance gates (anchors + spec-lint)      0.12 m   macos-latest
#   Install Linux system deps                   0.23 m   DROPPED (apt + xvfb)
#   Clippy (libs + bins)                        4.58 m   macos-latest
#   Check ui minimal build                      1.25 m   macos-latest
#   Reproduce the sample figure (story 6-12)    5.22 m   macos-latest
#   backtest yahoo-gated ticker-flag tests      0.02 m   macos-latest
#   backtest realdata p2 verdict rerun          (new)    macos-latest
#   backtest realdata threshold-sweep guard     (new)    macos-latest
#   forecast candle-gated tests                 1.72 m   macos-latest
#   Test ui (headless, Linux)                   4.57 m   DROPPED
#   Report corpus-gated skips (informational)   0.23 m   DROPPED
#
# The two DROPPED test steps, on the record here rather than only in a diff:
#
#   - "Test ui (headless, Linux)" was `xvfb-run -a cargo test -p ui --features
#     fixtures`. What it tested was whether the cockpit's winit/tiny-skia stack
#     comes up on an X11 virtual framebuffer: a Linux property, with no Linux leg
#     left to hold it. It took no TEST with it. `crates/ui/src/lib.rs` declares
#     `pub mod fixtures;` UNCONDITIONALLY (see its comment at :117), so
#     `--features fixtures` gates only `[[bin]] required-features` and
#     bin/cockpit.rs's default state — not the 116 integration-test targets. macOS
#     runs every one of them, visual baselines included; Windows runs them minus
#     the `#![cfg(target_os="macos")]` visual set. Side effect worth naming:
#     bug-log `#172` — one unexplained red of THIS step, recorded as an open
#     observation — loses its subject, and with it the "wait for a second
#     instance" path to closing it.
#
#   - "Report corpus-gated skips (informational)" could not fail by construction:
#     `|| true` on both commands and no assertion anywhere. Its premise was also
#     false. It printed "expected >0 in CI — the pinned corpus is machine-local",
#     but `data/binance` has been tracked since 2026-09-27 (241 paths) and this
#     workflow checks out `lfs: true` — which is exactly what bug-log `#186`
#     established two steps further down this file. What it was reaching for —
#     "did the corpus-gated guards actually execute?" — is now carried by the p2
#     step's PRECONDITION below, which asserts the corpus is present and FAILS
#     when it is not, instead of printing a count into a log that nobody here can
#     download (403).
#
# TLS: reqwest is rustls-tls (D1) — no pkg-config/libssl on either leg. The
# `libssl-dev` note that used to sit here covered Ubuntu's native-tls build of
# tokio-tungstenite; Windows uses schannel and macOS Secure Transport, so no
# system-package step remains at all.
#
# ── Caching (added 2026-11-09) ────────────────────────────────────────────────
#
# This file said "Keep it minimal — no caching" from its first commit, and the
# measurement says what that cost: `Build ui (fixtures)` took 17.80 min on macOS
# and 18.22 min on Windows from a cold runner, nearly all of it third-party
# dependency compilation — the workspace root optimizes ALL dependencies at
# `opt-level = 3` even in dev (`Cargo.toml:64`, load-bearing: the 40x debug-tax
# note above it). `Swatinem/rust-cache` caches exactly that and nothing of ours.
# No step's coverage changes; see the step itself for the two risks it carries.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual trigger. Without it, a cancelled run can be restarted ONLY by
  # re-running it or by pushing a commit, and both are writes to the Actions
  # API — which the dev box cannot make: its unauthenticated `gh` READS runs
  # fine (60/hour by IP) but every write returns HTTP 401. Added 2026-11-09,
  # after four concurrent runs were cancelled and starting a fresh one would
  # otherwise have required inventing a commit.
  workflow_dispatch:

# ── Serialize runs per ref (added 2026-11-10) ─────────────────────────────────
#
# Without this key every push starts a run that races the one before it. Measured
# consequence, twice in two days: four concurrent runs on 2026-11-09, cancelled by
# hand (the `workflow_dispatch:` note above is the fallout), and on 2026-11-10 a
# push onto an in-progress `4777982f` would have put two COLD runs on `main` both
# racing to populate the brand-new `Swatinem/rust-cache` entry — one wins, the
# other spends ~80 Windows-minutes computing a cache save that is then discarded.
# That is the opposite of the reason the Ubuntu leg was dropped.
#
# `cancel-in-progress` is TRUE for pull requests only: a superseded PR run is
# pure waste. On `main` it is FALSE, because a main run is the record — it holds
# the governance verdict and it is what writes the cache. GitHub keeps one RUNNING
# and one PENDING run per group, so the trade-off, named rather than discovered:
# push three commits quickly and the middle one is superseded WITHOUT a CI verdict
# of its own. The newest commit is still verified and the skipped one is its
# ancestor, which is the property that matters here; `workflow_dispatch` is the
# lever if a specific intermediate commit ever needs its own run.
#
# This is a key, not a gate. Nothing fails if it is deleted — the symptom is a
# pile-up two days from now, which is exactly how it got here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The forecast crate's checkpoint anchors (crates/forecast/checkpoints/
          # anchors/*.safetensors) are LFS-tracked; without lfs:true the runner
          # gets pointer stubs and the checkpoint-anchor tests fail (first-CI
          # shakeout finding, run #2 2026-07-12).
          lfs: true

      # ── Canonical leg: repo governance gates (fail fast, before any compile) ──
      # The constitutional invariants — AD-2 anchors byte-immutability and the
      # ADR-0082 story↔trace↔CHANGELOG triad — were previously enforced ONLY by
      # agent discipline (2026-07-27 adversarial-review hardening; bug-log #66
      # showed what discipline-only enforcement ships). One leg suffices: these
      # check repo STATE, not platform behaviour, and every one of them is
      # stdlib-only Python or bash.
      #
      # MOVED from the Ubuntu leg to macOS on 2026-11-09 with the matrix narrowing.
      # The move's own risk is portability, so it was MEASURED on the dev box
      # (macOS 26.7.2, bash 5.3.20, python3 3.15.2) before it landed: all thirteen
      # commands below ran and passed — `ANCHORS PASS  (119 / 119)`, spec-lint
      # `PASS (0 violations)`, and the five other gates each with its `--self-test`
      # (4, 20, 4 and 5 probes fired respectively). They stay the FIRST step of the
      # job, ahead of the toolchain install and the cache restore, so a
      # constitutional failure still costs seconds instead of an hour.
      # Pinned because the gates below are invoked as bare `python3` and two of
      # them — `spec_lint.py` and `check_determinism_anchors.py` — import
      # `tomllib`, which is 3.11+. Both declare `requires-python = ">=3.11"` in a
      # PEP-723 header that bare `python3` does not read, so the requirement is
      # satisfied by whatever the runner image happens to ship. On the Ubuntu leg
      # that was 3.12 and it never came up; the gates moved to macOS on
      # 2026-11-09 and nothing in this file guarantees that leg's interpreter.
      # The failure is not hypothetical: on 2026-10-10 a Homebrew update left
      # `/usr/bin/python3` 3.9.6 first on PATH on the dev box and every
      # governance command died on `ModuleNotFoundError: tomllib` mid-session
      # (`.githooks/pre-commit` carries the same note, and solves it with `uv
      # run`, which reads the header). 3.12 matches the interpreter `uv` selects
      # locally, so the hook and this job now disagree about nothing. Costs ~5 s,
      # against a one-leg governance block whose alternative is an inherited
      # dependency (bug-log `#189`).
      - name: Pin Python for the governance gates
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Governance gates (anchors + spec-lint)
        if: matrix.os == 'macos-latest'
        # `shell: bash` is LOAD-BEARING, not style (bug-log #84, 2026-08-15).
        # GitHub's default `run:` shell is `bash -e {0}` — WITHOUT `pipefail` — so
        # `verify_anchors.sh | tail -1` exited with *tail's* status (always 0) and
        # this gate could not fail. AD-2's only remote enforcement was inert from
        # activation until now. `shell: bash` makes Actions use
        # `bash --noprofile --norc -eo pipefail {0}`, so the pipeline's failing head
        # propagates. Demonstrated: `bash -e -c 'false | tail -1'` → 0 versus
        # `bash -eo pipefail -c 'false | tail -1'` → 1.
        # Do NOT remove this line, and do not add a `| tail`-style pipe to any other
        # gate step without it.
        shell: bash
        run: |
          # Declared, not assumed. If the pin above is ever removed or the image
          # changes, this fails on the VERSION with the version in the log,
          # instead of on `ModuleNotFoundError: tomllib` three commands later.
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version; print("governance interpreter:", sys.version.split()[0])'
          bash scripts/verify_anchors.sh | tail -1
          python3 scripts/spec_lint.py
          python3 scripts/spec_lint.py --self-test
          # bug-log #154: the three verdict classifiers live in [[bin]]s, so their tests
          # re-implement them and test the copy. This pins the branch conditions on both
          # sides against a set declared in the script, and its --self-test re-measures
          # the gate's own teeth on every run rather than trusting that they are still there.
          python3 scripts/verdict_transcription_check.py
          python3 scripts/verdict_transcription_check.py --self-test
          # bug-log #163: a target whose required-features are unmet is skipped by
          # `cargo test` SILENTLY. Measured: 46 test fns across 13 targets have never
          # run in this workflow — including every candle-gated forecast test, while
          # candle-core compiles anyway (crates/backtest/Cargo.toml:63 pulls
          # forecast/candle unconditionally). This gate does not turn those features
          # on; it makes the exclusion declared and counted, printing the invisible
          # count on every run so the silence is in the log.
          python3 scripts/feature_gated_targets_check.py
          python3 scripts/feature_gated_targets_check.py --self-test

          # bug-log #179: verify_anchors.sh above asks whether each row's SHA matches a
          # committed body. It is content for TWO rows of one scenario to point at the
          # SAME body — so a re-emission that runs one invocation and writes it to two
          # rows silently merges two friction namespaces while the gate still prints
          # 119/119. Measured: the 2026-10-29 re-lock put default zero-slippage output
          # into six CANONICAL rows (a 28 pp gap against a real --sim-slippage-bps 8
          # run), and the next re-emission was about to do the mirror of it. This
          # declares the distinct-body count per scenario so neither a collapse nor a
          # split lands unseen.
          python3 scripts/anchor_namespace_collapse_check.py
          python3 scripts/anchor_namespace_collapse_check.py --self-test

          # bug-log #183 durable fix: this tool maps every in-test SHA literal to its
          # anchors.toml row, and until now it was named in this workflow only inside a
          # comment about something else — never run. The stale pin of #181 was caught by
          # a Rust test on all three legs instead. It is pure Python; it costs seconds.
          python3 scripts/check_determinism_anchors.py
          python3 scripts/check_determinism_anchors.py --self-test

          # bug-log #183: a body SHA lives in anchors.toml and is COPIED into source.
          # When #183 was filed, check_determinism_anchors.py synced five of the NINE
          # files that mirror a current anchors row, and the uncovered one holding 35
          # of them took this workflow red on all three legs. The durable fix put eight
          # of the nine under that tool (gated just above); this census pins the count
          # itself. A stale copy stops matching, so the file's mirror count drops below
          # its declared floor and this fails. Its uncovered count is DERIVED from the
          # sync tool's own file list, so it cannot go stale when that list grows.
          python3 scripts/sha_mirror_census.py
          python3 scripts/sha_mirror_census.py --self-test

          # bug-log #190: a census of every `--self-test`-bearing script under
          # `scripts/` against this step and `.githooks/pre-commit` found SIX wired
          # and FIVE not. Among the five was `adr_registry_check.py`, which
          # CLAUDE.md's AD-18 non-negotiable names AS the enforcement of ADR
          # atomicity — flagged unwired by the 2026-08-17 and 2026-08-24 audits and
          # still unwired on 2026-11-10, when ADR-0102's missing Registry row was
          # caught only because somebody ran the script by hand. All six are pure
          # stdlib Python or bash over source; together they cost ~9 s on a leg that
          # takes an hour.
          python3 scripts/adr_registry_check.py
          python3 scripts/adr_registry_check.py --self-test

          # AD-19 — no secrets in git. Gated in the hook too, because this one is
          # unsaveable once a commit is pushed; here it is the backstop for a clone
          # that never ran `git config core.hooksPath .githooks`.
          bash scripts/check_no_secrets_in_llm_artifacts.sh

          # AD-10 — the visual baselines are byte-compared, so a clock or RNG call
          # on the snapshot path makes them non-deterministic. Rebuilt 2026-11-10:
          # it had been RED on two doc comments and one marker whose reason wrapped
          # onto a second line, while nothing ran it but a hand-invoked skill.
          bash scripts/check_no_clocks_in_ui_tests.sh
          bash scripts/check_no_clocks_in_ui_tests.sh --self-test

          # Operator-ledger schema + backlog Queue staleness: sub-second, and
          # previously enforced by whoever remembered.
          python3 scripts/operator_ledger_check.py
          python3 scripts/operator_ledger_check.py --self-test
          python3 scripts/queue_staleness_check.py
          python3 scripts/queue_staleness_check.py --self-test

          # PIT discipline over 413 production files. 6.0 s measured, which is why
          # this one is CI-only: an as-of join is fixable after the fact, so it does
          # not earn 6 s on every local commit.
          bash scripts/check_no_raw_asof_join.sh
          bash scripts/check_no_raw_asof_join.sh --self-test

      # `components: clippy` is explicit rather than inherited. The clippy step
      # below was proven on the Ubuntu image and now runs on the macOS one, and
      # what made it work was the runner image's pre-installed toolchain, not this
      # action — `dtolnay/rust-toolchain` installs with `--profile minimal`, which
      # does NOT include clippy. Naming the component means the step depends on a
      # declaration instead of on an image's contents. Costs seconds; it is already
      # installed on the hosted images, so this is a no-op there and insurance
      # anywhere else.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ── Dependency cache ──────────────────────────────────────────────────
      #
      # The action keys the entry itself — job_id + rustc release/host/hash + a hash
      # of Cargo.lock, the Cargo.toml files and .cargo config — so the two legs never
      # share an entry and a toolchain bump invalidates cleanly. It also sets
      # `CARGO_INCREMENTAL=0`, which is what CI wants: incremental artifacts are
      # large and worthless across runs.
      #
      # EXPECTED saving, and stated as expected because nothing here has run it: the
      # dependency share of `Build ui (fixtures)` — 17.80 min macOS / 18.22 min
      # Windows on run 42575316185. Inside one job that compile is paid ONCE and the
      # later steps reuse it, so that step is the only place a cache can win. It
      # cannot touch the 34.4 min (macOS) / 52.2 min (Windows) workspace test step,
      # whose cost is this repo's own 17 crates and ~339 test binaries — artifacts
      # rust-cache deliberately prunes rather than saves.
      #
      # TWO RISKS, both readable off the next runs instead of guessed:
      #  1. GitHub allows 10 GB of cache per repository and evicts oldest-first past
      #     that (docs.github.com "Dependency caching reference"; the action's README
      #     says the same). The dependency set here is candle + polars + arrow +
      #     iced at opt-level 3, so two entries may be a large fraction of it. If they
      #     thrash, every run is cold AND pays the restore attempt on top. Measure:
      #       gh api repos/<owner>/<repo>/actions/caches \
      #         --jq '.actions_caches[] | "\(.size_in_bytes)  \(.key)"'
      #  2. A restored `target/` that does not match the source is a correctness
      #     risk in principle; cargo's own fingerprinting is what rules it out, and
      #     the action prunes anything that is not a dependency before saving.
      #
      # `save-if` keeps PR runs read-only, so they restore but never evict main's
      # entries. `cache-on-failure` is ON deliberately: this workflow was red on
      # every push for a 15-day stretch (docs/dev-notes/bug-log.md), and with the
      # default `false` every run in such a stretch is also a cold run.
      - name: Cache cargo registry + dependency build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # ── Clippy — canonical leg, macOS since 2026-11-09 ─────────────────────
      #
      # CLAUDE.md states `cargo clippy -- -D warnings` MUST pass, and until now
      # nothing enforced it remotely: `grep -c clippy ci.yml` returned 0. The gap
      # was found the ordinary way — a pre-existing unused import in
      # `agent/src/activity.rs` sat in `main` because no gate looked.
      #
      # SCOPE IS DELIBERATE AND LOAD-BEARING. This is `--workspace` WITHOUT
      # `--all-targets` / `--tests`, so it lints libs and bins only. CLAUDE.md
      # records why: linting all targets links 339 integration-test binaries
      # across 17 crates — one measured cycle took 52 MINUTES and grew
      # `target/debug` to 155 GB, filling a 460 GB disk. A gate that cannot
      # finish is not a gate. Test-target lints stay a local, per-crate concern
      # (`cargo clippy -p <crate> --tests`).
      #
      # One leg only: clippy findings are not OS-specific, and a second copy would
      # double the cost for no extra signal.
      #
      # MOVED to macOS 2026-11-09 with the matrix narrowing. The move changes WHICH
      # cfg-gated code gets linted, so it was measured in both directions rather
      # than assumed:
      #   - nothing loses coverage — `grep -rl 'target_os *= *"linux"' crates/`
      #     finds ZERO files, so there is no Linux-only code that only this leg saw;
      #   - the macOS-only code it now lints for the FIRST time is clean —
      #     `cargo clippy --workspace -- -D warnings` on the dev box finished with
      #     exit 0 and zero warnings (`Finished dev profile in 39.93s`; a warm
      #     target dir, so that is a cleanliness result and not a CI-time estimate).
      # Had that come back dirty, the move would have been a red first run rather
      # than a note in a report.
      - name: Clippy (libs + bins, canonical leg only)
        if: always() && matrix.os == 'macos-latest'
        run: cargo clippy --workspace -- -D warnings

      # ── All legs: build the ui crate (fixtures binary) ────────────────────
      - name: Build ui (fixtures)
        run: cargo build -p ui --bin cockpit --features fixtures

      # ── The MINIMAL build (bug-log #92) — canonical leg ────────────────────
      # `crates/ui/Cargo.toml` documents `--no-default-features` as a supported
      # opt-out ("for the gallery-only bin"). NOTHING built it, so it rotted: from
      # roughly the 2026-05-25 promotion of `live` to a default feature until
      # 2026-08-22 it failed with three E0432 errors, because `state.rs`,
      # `lab/activity.rs` and `widgets/activity_tape.rs` imported the `live`-only
      # `agent` crate unconditionally. Fixed by relocating the wire types to
      # `trading_core` (ADR pending); THIS STEP is what stops it happening again.
      #
      # Cheap by design — `cargo check`, one leg, no tests. The point is coverage
      # of a build configuration, not of behaviour. A documented capability that
      # nothing exercises is the defect class this whole burn-down keeps finding.
      #
      # macOS since 2026-11-09 (was Ubuntu). `always() &&` for the same reason as
      # every other gate on this leg: an earlier red must not silently cancel it.
      - name: Check ui minimal build (--no-default-features)
        if: always() && matrix.os == 'macos-latest'
        run: cargo check -p ui --no-default-features --features fixtures

      # ── Both legs: test the non-UI workspace crates ────────────────────────
      # Excludes `ui` because each leg runs its own ui step below:
      #   - macos: the full ui suite, the 56 visual baselines included (canonical).
      #   - windows: the same suite minus the #![cfg(target_os="macos")] visual set.
      # ── A FAILING STEP MUST NOT CANCEL THE GATES BELOW IT ────────────────
      #
      # Measured 2026-08-23: with this step red, steps 9-12 all reported
      # `skipped` — including "Test ui (full suite, macOS canonical gate)", which
      # is AD-10's canonical rendered-pixel gate. So for as long as CI was red on
      # ANY cause, the entire UI evidence base ran zero assertions on every leg,
      # and the run's summary said nothing about it.
      #
      # That is this project's recurring defect wearing a CI hat: a gate that
      # never executes is indistinguishable from a gate that passed. It is also
      # how the `leaderboard_scorecard_render` regression (bisected to 67f2a9d)
      # stayed unreported — it is a REAL failure on the canonical box that no run
      # ever reached.
      #
      # The UI steps below therefore carry `always() &&` in front of their OS
      # condition: an earlier failure no longer cancels them. A failing step still
      # fails the job — nothing is being made permissive here; the run just stops
      # hiding what else is broken.
      #
      # WHY THIS STEP IS A SCRIPT AND NOT `run: cargo test ...`
      #
      # Run logs require repo ADMIN to download (`gh run ... --log-failed` ->
      # HTTP 403 for everyone else), so a plain `cargo test` failure is visible to
      # a non-admin only as the word "failure" next to a step name. Diagnosing the
      # 2026-08-22 red run therefore took a clean-clone reproduction to learn a
      # fact one line of output already contained.
      #
      # `::error::` lines become run ANNOTATIONS, which are part of the run's
      # public metadata rather than its log. So the failing test names travel out
      # of the log and can be read without admin. `--no-fail-fast` makes that list
      # COMPLETE — the default stops at the first failing target and would have
      # hidden that one fix was not the whole fix.
      - name: Test workspace (non-ui crates)
        shell: bash
        run: scripts/ci_run_annotated.sh "workspace" cargo test --workspace --exclude ui --no-fail-fast

      # Story 6-12 — the reproducibility sample. The ONE real-data figure in this
      # repo that a second party can reproduce from a fresh clone.
      #
      # ONE LEG ONLY — macOS since 2026-11-09, previously Ubuntu. This proves
      # reproducibility from the committed bytes, which is a property of the data and
      # the engine, not of the operating system. Running it on both legs would double
      # the cost of the `yahoo` feature build to re-assert the same fact. (If cross-OS
      # float determinism is ever in question, that is a separate, measured decision —
      # the same one ADR-0057 D2 made for the pixel gates.) It cost 5.22 min on the
      # Ubuntu runner; expect more here, since macOS ran `Build ui` at 1.86x and the
      # workspace test at 1.47x Ubuntu's time on run 42575316185.
      #
      # It needs the `yahoo` feature, which the workspace test step above does not
      # enable, and `python3` for the canonical body hash — already a prerequisite of
      # the governance-gate steps.
      #
      # AC4's whole point: without this the recipe becomes a stale document nobody runs,
      # and the day the engine drifts away from the anchor nobody finds out. Bug-log #93
      # is what that looks like when it happens unobserved.
      - name: Reproduce the sample figure (story 6-12)
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "repro-sample" cargo test -p backtest --features yahoo --test reproducibility_sample_figure

      # ── backtest's other yahoo-gated target (bug-log #184) ────────────────
      #
      # bug-log #163 left three targets invisible and named the blocker for each.
      # This one needs ONLY `yahoo`, and the step above already pays for the `yahoo`
      # build of this very package, so adding it costs a test run and no compile.
      #
      # CORRECTED 2026-11-09 (bug-log #186). This block used to say the other two
      # "need `realdata`, which wants data/binance/REVISION.toml provisioned in CI —
      # a separate operator decision". BOTH halves of that are false and were when
      # written: the corpus has been tracked since 2026-09-27 (241 paths under
      # data/binance, declared `binary`, and this workflow checks out `lfs: true`),
      # and `polars` is a NON-OPTIONAL dependency of data/forecast/reports, so
      # `dep:polars` under `realdata` adds nothing to the graph that every build
      # already compiles. Measured: the two targets pass, 10 live test fns
      # (8 passed/7 ignored + 2 passed). WIRED 2026-11-09 in the two steps below,
      # once the #185 Windows verdict came back green (run 42575316185, all three
      # legs success) so this would be the only experiment riding its own run.
      #
      # What it recovers is not generic coverage. Two of its six tests,
      # `btc_default_sha_matches_anchor_69` and `eth_ticker_sha_matches_anchor_70`,
      # invoke the `run_yahoo_sma` BINARY and hash its output — a second witness that
      # RE-RUNS THE PRODUCER, which is the thing the on-disk anchor gates structurally
      # cannot do (bug-log #93, #111, and the header of
      # crates/reports/tests/strategy_anchors_unchanged.rs). Those are precisely the
      # two rows bug-log #182 re-emitted, and until this step nothing in CI re-derived
      # them. The other four pin the ALLOWED_YAHOO_TICKERS cross-crate mirror, the two
      # scenario-name formats, and the unknown-ticker exit code.
      #
      # MEASURED locally 2026-11-08 before this step was added:
      #   cargo test -p backtest --features yahoo --test run_yahoo_sma_ticker_flag
      #   -> 6 passed, 0 failed, 0 ignored, 0 filtered out, 0.80 s
      # It reads the committed 100 KB data/yahoo-sample corpus and needs no network
      # (crates/data/Cargo.toml: "yahoo" is the cache read path; "yahoo-online" is the
      # fetching one and stays out).
      #
      # One leg only — macOS since 2026-11-09 — for the same reason as the step
      # above: these assert properties of the data, the engine and the CLI contract,
      # not of the operating system, and the other leg would pay a fresh `yahoo`
      # feature build to re-assert them. It stays immediately after the repro step so
      # it keeps reusing that step's `yahoo` build (0.02 min on Ubuntu: a test run and
      # no compile).
      # A SEPARATE step rather than a second --test on the step above so its CI
      # annotation carries its own label — logs are 403 here, annotations are how a
      # failure gets read.
      - name: "backtest yahoo-gated ticker-flag tests (bug-log #184)"
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "yahoo-ticker-flag" cargo test -p backtest --features yahoo --test run_yahoo_sma_ticker_flag

      # ── backtest's realdata-gated targets (bug-log #186) ──────────────────
      #
      # The last two targets bug-log #163 left invisible. Both of the blockers on
      # file for them were false (see the corrected block above), so what remained
      # was cost and evidence, and both are now measured.
      #
      # COST. These two spend a backtest recompile under realdata,candle,yahoo plus
      # ~50 s of test time (measured locally 2026-11-09: build 24 s; p2_verdict_rerun
      # 21.2 s → 8 passed / 0 failed / 7 ignored; threshold_sweep_readonly 22.4 s →
      # 2 passed).
      #
      # The headroom argument that used to stand here died with the Ubuntu leg, and
      # is replaced rather than deleted. It read: windows paced run 42575316185 at
      # 82.5 min while ubuntu finished in 51.1, so an ubuntu-only step had ~31 min of
      # slack before it moved the matrix wall clock. After the 2026-11-09 narrowing
      # the slack belongs to macOS, which finished that run in 59.4 min — ~23 min
      # behind windows — and the re-homed Ubuntu-only steps summed to 12.9 min of
      # UBUNTU time, which at the 1.47-1.86x macOS multiplier measured on the same
      # run is roughly 19-24 min. So the slack is now approximately spent and macOS
      # may take over as the pacer. That is a wall-clock statement, not a coverage
      # one, and the first two-leg run settles it: read it with
      #   gh run view <id> --json jobs --jq '.jobs[] | "\(.name) \(.startedAt) \(.completedAt)"'
      # The second step reuses the first step's build — same feature set — and is a
      # separate step only so its annotation carries its own label, for the same
      # reason as the step above: logs are 403 here, annotations are how a failure
      # gets read.
      #
      # THE PRECONDITION IS LOAD-BEARING, not decoration. `s4_binance_2324_base_smoke`
      # SKIPs and RETURNS when data/binance/BTCUSDT is absent, so without it this
      # step could report success having measured nothing — the "gate that cannot
      # fail" shape of #135 / #161 / #186. The declared condition is 24 parquet files
      # (10 symbols × 24 months + REVISION.toml = 241 tracked paths) each over 10 KB:
      # the real files are 24.4–27.8 KB, an LFS pointer stub is ~130 B, so the size
      # floor distinguishes "checked out" from "pointer only" rather than merely
      # "present". Its portability to this leg is measured, not assumed: the block
      # below was re-run VERBATIM on the macOS dev box on 2026-11-09 and printed
      # "24 parquet files, smallest 24441 bytes" before passing both tests — which is
      # what the `-exec wc -c` form (rather than GNU `find -printf`) was chosen for.
      #
      # WHAT THE LOCAL MEASUREMENT DOES AND DOES NOT COVER. It visits CI's data state,
      # not a richer one: data/deribit-dvol and data/yahoo-macro hold only
      # REVISION.toml on the dev box too, so `v0.dvol_regime` is DROPPED and
      # `v0.macro_riskon` runs warm-up-only in BOTH places (24 candidates ranked,
      # crowned v0.buyhold). Those absence paths are non-fatal by construction —
      # bakeoff/mod.rs returns None and logs, per #78's "never degrade a probe into a
      # stub that keeps the probe's label". The one dimension the local run does not
      # visit is the OS; s4's assertions are structural (a crowned candidate exists,
      # candidates are non-empty, the benchmark is present), not SHA-pinned, so there
      # is no platform-float surface here.
      #
      # No `| head` in these pipelines: `shell: bash` means pipefail (bug-log #84),
      # and head closing the pipe early SIGPIPEs its producer into a false failure.
      - name: "backtest realdata-gated p2 verdict rerun (bug-log #186)"
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          test -f data/binance/REVISION.toml
          n=$(find data/binance/BTCUSDT -name '*.parquet' | wc -l)
          # `wc -c` via -exec, not find's -printf: -printf is GNU-only, and a
          # precondition I cannot run on the dev box is the one unmeasured line in a
          # step that exists to be measured. This form runs on both.
          smallest=$(find data/binance/BTCUSDT -name '*.parquet' -exec wc -c {} \; | awk '{print $1}' | sort -n | sed -n '1p')
          echo "precondition: data/binance/BTCUSDT holds $n parquet files, smallest $smallest bytes"
          test "$n" -eq 24
          test "$smallest" -gt 10000
          scripts/ci_run_annotated.sh "p2-verdict-rerun" cargo test -p backtest --features realdata,candle,yahoo --test p2_verdict_rerun -- --nocapture

      - name: "backtest realdata-gated threshold-sweep read-only guard (bug-log #186)"
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "threshold-sweep-readonly" cargo test -p backtest --features realdata,candle,yahoo --test threshold_sweep_readonly

      # ── forecast's candle-gated tests (bug-log #163, operator-approved 2026-11-08) ──
      #
      # `cargo test` SKIPS a target whose `required-features` are unmet in silence:
      # no warning, no note, exit 0. The workspace step above runs with default
      # features, so until this step existed, 9 forecast test targets had NEVER run
      # in CI and nothing said so.
      #
      # The usual reason to keep an ML feature out of CI is its compile cost, and
      # that reason does not apply here: `crates/backtest/Cargo.toml:63` depends on
      # `strategy` with `features = ["forecast"]` UNCONDITIONALLY, which pulls
      # `forecast/candle`, so candle-core is compiled on every default run already
      # (17 `libcandle_core*` rlibs in a default `target/debug/deps`). CI was paying
      # for the ML backend and getting none of the tests that need it.
      #
      # A SEPARATE step rather than `--features` on the workspace run: adding a
      # feature there changes resolution for every crate in the run, and this needs
      # to add 13 targets, not perturb 300. Same shape as the yahoo step above.
      #
      # MEASURED locally 2026-11-08 before this step was added:
      #   cargo test -p forecast --features candle --no-fail-fast
      #   -> 33 targets, 191 passed, 0 failed, 18 ignored, 507 s from a cold build
      # The 18 ignored are the pre-existing long/corpus-gated ones (~487 s and
      # ~620 s forward passes); this step does not pass `--ignored`.
      #
      # One leg only — macOS since 2026-11-09 — for the same reason as the step
      # above: these assert properties of the model code and its checkpoints, not of
      # the operating system, and the candle build is the expensive part.
      # `scripts/feature_gated_targets_check.py` declares what each leg does and does
      # not build, so this scope is recorded rather than assumed.
      #
      # Note on the two numbers: the 507 s above is a COLD local build, while this
      # step took 1.72 min on the Ubuntu runner — because the workspace test step
      # ahead of it has already compiled candle-core, exactly as the paragraph above
      # says it does. Only the forecast crate and its 33 targets are left to build.
      - name: "forecast candle-gated tests (bug-log #163)"
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "forecast-candle" cargo test -p forecast --features candle --no-fail-fast

      # ── macOS: full ui test suite including the 56 visual baselines ────────
      # This is the canonical visual regression gate (ADR-0057 D1/D2, R-NR.1).
      # The #![cfg(target_os="macos")] source gate compiles the visual tests IN
      # on macOS only; they run against the 56 committed baseline PNGs.
      - name: Test ui (full suite, macOS canonical gate)
        # `always() &&` — this is AD-10's canonical gate; it must never be skipped
        # as a side effect of an unrelated step failing.
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "ui-macos" cargo test -p ui --no-fail-fast

      # ── Windows: build + non-visual cargo test -p ui (D5 scope) ───────────
      # The windows = "=0.57.0" dep stanza (D4) makes pid_alive.rs compile.
      # Visual baselines are compiled OUT by the #![cfg(target_os="macos")] gate.
      # Interactive window UX on Windows is best-effort at v0.1 (no Windows HW
      # for manual QA); full interactive parity is a v0.2 follow-on (D5).
      - name: Test ui (non-visual, Windows)
        if: always() && matrix.os == 'windows-latest'
        shell: bash
        run: scripts/ci_run_annotated.sh "ui-windows" cargo test -p ui --features fixtures --no-fail-fast
