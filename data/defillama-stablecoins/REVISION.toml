# DefiLlama stablecoin-supply snapshot — on-chain spike (2026-06-08).
#
# Daily per-chain stablecoin circulating supply (USD) fetched from the FREE,
# no-auth DefiLlama stablecoins API for the on-chain-netflow-spike. Net-flows were
# ruled out at the PIT gate (CryptoQuant: paid key + vendor-disclaimed mutable
# history from address relabeling); this is the pre-named cleaner-PIT fallback
# signal (mint/burn at issuer contracts is immutable on-chain; DefiLlama records a
# forward-dated daily snapshot per chain — a chain's series begins at its launch,
# verified e.g. Base 2023-08-15, no pre-launch backfill).
#
# Bulk parquets are gitignored (mirrors data/binance-basis); only this manifest is
# tracked so the spike's stablecoin_diag.rs numbers are reproducible.
#
# Endpoint: GET https://stablecoins.llama.fi/stablecoincharts/{chain}
#   value used = totalCirculatingUSD.peggedUSD per daily point (date @ 00:00 UTC).
# Schema (per <chain>.parquet): day_key Int64 (days since epoch), supply_usd Float64.

