# spec/trace.toml — Traceability index.
#
# One row per requirement. Connects: product/architecture refs → feature
# folder → crate(s) → test path(s) → anchor scenario name(s).
#
# This is the index spec-lint and spec-auditor consume. A row with missing
# required fields is a lint violation; a row whose paths don't resolve is
# also a lint violation. Anchors cited here must exist in anchors.toml.
#
# Ownership:
#   - analyst writes the `[req]` row when a feature enters `proposed`.
#   - architect fills `arch` (and ADR refs once Phase 1A lands).
#   - developer fills `crates` and `tests`.
#   - tester fills `anchors` (only after `verify-anchors` PASS).
#
# Status states match feature.md frontmatter:
#   draft | proposed | candidate | in-progress | roadmap | shipped | deprecated
#
# This file is the seed produced on 2026-05-13. Every shipped feature gets
# one row capturing what is known today; gaps (empty `tests`, missing
# `anchors`) become spec-auditor punch-list items for the appropriate
# owner to close.

#
# ─── Strategy features ──────────────────────────────────────────────────
#

