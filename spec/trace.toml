ven-weak edge, and combining Fragile-AND-correlated strategies cannot help; a NULL result ('every pre-registered combination also Fragile, hold stands') is a VALID + EXPECTED + shippable finding. HARD NON-goals: robustness bands FROZEN (NO loosening / NO asset-class-tuning of verdict_bands/classify_verdict/compute_robustness_flag — this is NOT a B2/B3 band proposal, those were operator-REJECTED; frame as 'more candidates face the same bar,' NEVER 'we moved the bar'); the ADR-0059 §D5 anti-overfit eligibility lock + ADR-0063 §D4 classifier freeze UNCHANGED; BenchmarkWins/AllFragile reachability UNCHANGED (F8 §4 / ADR-0066); anchor-safe BY CONSTRUCTION (new v0.8.vote.* ids run write_report=false on the Bootstrap advisor path → no anchored body collision; verify_anchors.sh stays 119/119, run before AND after); NO new backtest math / NO new gate / NO EnsembleStrategy reinvention; NO new signal TYPES (sibling backlog item); NO short-selling (sibling backlog item, deferred to v2 — needs engine work for negative positions + borrow/funding); NO combination-SEARCH engine in v1 (quarantined to a guarded follow-on — if ever built MUST ship walk-forward/out-of-sample split + complexity penalty [deflated-Sharpe/Bonferroni] + pre-registered search procedure + loud risk call-out); weighted/inverse-vol/conditional-regime blends DEFERRED to a v0.2 of this feature (they need a NEW VoteMethod variant + new arbitrate branch + new PlanVoteMethod mirror + new UI match arm, AND a continuous weight = free knob = overfit risk unless rule-derived/pre-registered)."
