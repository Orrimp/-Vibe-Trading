<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Surfaces (light)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 22px; }
  .stage { background: #F6F4EF; border-radius: 6px; padding: 18px; display: flex; gap: 14px; }
  .tier { flex: 1; padding: 14px; border-radius: 6px; border: 1px solid #E2DDD2; font-size: 12px; }
  .t0 { background: #F6F4EF; }
  .t1 { background: #FBFAF7; box-shadow: 0 1px 1px rgba(20,19,15,0.04), 0 1px 2px rgba(20,19,15,0.04); }
  .t2 { background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,19,15,0.05), 0 4px 10px rgba(20,19,15,0.06); }
  .t3 { background: #FFFFFF; box-shadow: 0 2px 4px rgba(20,19,15,0.06), 0 12px 24px rgba(20,19,15,0.08); }
  .name { font-weight: 600; margin-bottom: 4px; font-size: 12px; }
  .meta { font-family: 'JetBrains Mono'; font-size: 10px; color: #6F6A5E; }
  .ttl { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="ttl">Surfaces & elevation — Light</div>
  <div class="stage">
    <div class="tier t0"><div class="name">Canvas</div><div class="meta">--canvas</div></div>
    <div class="tier t1"><div class="name">Panel</div><div class="meta">+ shadow-1</div></div>
    <div class="tier t2"><div class="name">Raised</div><div class="meta">+ shadow-2</div></div>
    <div class="tier t3"><div class="name">Modal</div><div class="meta">+ shadow-3</div></div>
  </div>
</div>
</body>
</html>
