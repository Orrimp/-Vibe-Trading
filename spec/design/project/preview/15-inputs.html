<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .lbl { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; min-width: 70px; }
  .input { font-family: 'Inter'; font-size: 13px; padding: 6px 10px; border-radius: 4px; border: 1px solid #C9C2B3; background: #EFEBE3; color: var(--fg-1); width: 200px; box-shadow: inset 0 1px 0 rgba(20,19,15,0.04); }
  .input:focus { outline: none; border-color: #3F968D; box-shadow: 0 0 0 3px rgba(63,150,141,0.28); }
  .num { font-family: 'JetBrains Mono'; font-variant-numeric: tabular-nums; }
  .grp { display: inline-flex; align-items: center; border: 1px solid #C9C2B3; border-radius: 4px; background: #EFEBE3; }
  .grp .input { border: none; background: transparent; box-shadow: none; width: 100px; padding-right: 4px; }
  .grp button { width: 22px; height: 26px; border: none; background: transparent; color: var(--fg-2); cursor: pointer; }
  .grp button:hover { color: var(--fg-1); }
  .pre { padding: 0 8px; color: var(--fg-3); font-family: 'JetBrains Mono'; font-size: 12px; border-right: 1px solid #C9C2B3; height: 26px; display: flex; align-items: center; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="lbl">Text</div><input class="input" value="NVDA"></div>
  <div class="row"><div class="lbl">Focus</div><input class="input" value="Limit price" style="border-color:#3F968D;box-shadow:0 0 0 3px rgba(63,150,141,0.28)"></div>
  <div class="row"><div class="lbl">Numeric</div>
    <div class="grp"><div class="pre">$</div><input class="input num" value="1,240.50"><button>−</button><button>+</button></div>
  </div>
  <div class="row"><div class="lbl">Disabled</div><input class="input" value="Read-only" disabled style="opacity:0.55;cursor:not-allowed"></div>
</div>
</body>
</html>
