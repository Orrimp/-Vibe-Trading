<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — AI assistant card</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 16px; background: #F6F4EF; }
  .panel { background: #FBFAF7; border: 1px solid #E2DDD2; border-radius: 6px; padding: 12px 14px; display: flex; gap: 10px; }
  .ico { width: 28px; height: 28px; border-radius: 6px; background: #ECF6F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #1F635D; }
  .body { flex: 1; }
  .who { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--fg-1); margin-bottom: 4px; }
  .who .tag { font-family: 'JetBrains Mono'; font-size: 9px; padding: 1px 5px; background: #D2EAE7; color: #184E49; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .msg { font-size: 13px; color: var(--fg-1); line-height: 1.5; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .a { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid #E2DDD2; background: #FFFFFF; cursor: pointer; color: var(--fg-1); }
  .a.primary { background: #3F968D; color: #fff; border-color: #3F968D; }
  .num { font-family: 'JetBrains Mono'; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card">
  <div class="panel">
    <div class="ico">
      <img src="../assets/brand/lumen-ai-lens.svg" width="22" height="22" alt="" style="opacity:0.9">
    </div>
    <div class="body">
      <div class="who">Lumen <div class="tag">AI signal</div></div>
      <div class="msg">Momentum is building in <b>NVDA</b>. Volume is <span class="num">+38%</span> above its 20-day average. Risk-adjusted entry around <span class="num">1,236</span>.</div>
      <div class="actions">
        <button class="a primary">Review signal</button>
        <button class="a">Dismiss</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
