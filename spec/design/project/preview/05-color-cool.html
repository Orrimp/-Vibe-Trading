<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Cool neutrals</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 22px; background: #131820; border-color: #232A33; }
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .sw { border-radius: 4px; padding: 8px 6px; height: 70px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid rgba(255,255,255,0.06); }
  .sw .n { font-family: 'Inter'; font-size: 10px; font-weight: 500; }
  .sw .h { font-family: 'JetBrains Mono'; font-size: 9px; opacity: 0.75; }
  .label-row { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .ttl { font-size: 13px; font-weight: 600; color: #E8ECF1; }
  .sub { font-family: 'JetBrains Mono'; font-size: 10px; color: #808993; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="card">
  <div class="label-row"><div class="ttl">Cool neutrals — depth</div><div class="sub">Dark-mode surfaces</div></div>
  <div class="grid">
    <div class="sw" style="background:#F7F8FA;color:#0B0F15"><div class="n">25</div><div class="h">#F7F8FA</div></div>
    <div class="sw" style="background:#EEF1F4;color:#0B0F15"><div class="n">50</div><div class="h">#EEF1F4</div></div>
    <div class="sw" style="background:#DDE2E8;color:#0B0F15"><div class="n">100</div><div class="h">#DDE2E8</div></div>
    <div class="sw" style="background:#BFC6CF;color:#0B0F15"><div class="n">200</div><div class="h">#BFC6CF</div></div>
    <div class="sw" style="background:#8E97A3;color:#0B0F15"><div class="n">300</div><div class="h">#8E97A3</div></div>
    <div class="sw" style="background:#5C6571;color:#fff"><div class="n">400</div><div class="h">#5C6571</div></div>
    <div class="sw" style="background:#3D454F;color:#fff"><div class="n">500</div><div class="h">#3D454F</div></div>
    <div class="sw" style="background:#2A3038;color:#fff"><div class="n">600</div><div class="h">#2A3038</div></div>
    <div class="sw" style="background:#1C2127;color:#fff"><div class="n">700</div><div class="h">#1C2127</div></div>
    <div class="sw" style="background:#131820;color:#fff"><div class="n">800 ◆</div><div class="h">#131820</div></div>
    <div class="sw" style="background:#0B0F15;color:#fff"><div class="n">900</div><div class="h">#0B0F15</div></div>
  </div>
</div>
</body>
</html>
