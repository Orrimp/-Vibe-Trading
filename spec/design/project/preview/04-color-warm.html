<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Warm neutrals</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 22px; }
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .sw { border-radius: 4px; padding: 8px 6px; height: 70px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid rgba(0,0,0,0.06); }
  .sw .n { font-family: 'Inter'; font-size: 10px; font-weight: 500; }
  .sw .h { font-family: 'JetBrains Mono'; font-size: 9px; opacity: 0.75; }
  .label-row { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .ttl { font-size: 13px; font-weight: 600; }
  .sub { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="card">
  <div class="label-row"><div class="ttl">Warm neutrals — paper</div><div class="sub">Light-mode surfaces</div></div>
  <div class="grid">
    <div class="sw" style="background:#FBFAF7;color:#14130F"><div class="n">25</div><div class="h">#FBFAF7</div></div>
    <div class="sw" style="background:#F6F4EF;color:#14130F"><div class="n">50</div><div class="h">#F6F4EF</div></div>
    <div class="sw" style="background:#EFEBE3;color:#14130F"><div class="n">100</div><div class="h">#EFEBE3</div></div>
    <div class="sw" style="background:#E2DDD2;color:#14130F"><div class="n">200</div><div class="h">#E2DDD2</div></div>
    <div class="sw" style="background:#C9C2B3;color:#14130F"><div class="n">300</div><div class="h">#C9C2B3</div></div>
    <div class="sw" style="background:#9E9788;color:#14130F"><div class="n">400</div><div class="h">#9E9788</div></div>
    <div class="sw" style="background:#6F6A5E;color:#fff"><div class="n">500</div><div class="h">#6F6A5E</div></div>
    <div class="sw" style="background:#4D4A41;color:#fff"><div class="n">600</div><div class="h">#4D4A41</div></div>
    <div class="sw" style="background:#34322C;color:#fff"><div class="n">700</div><div class="h">#34322C</div></div>
    <div class="sw" style="background:#22211D;color:#fff"><div class="n">800</div><div class="h">#22211D</div></div>
    <div class="sw" style="background:#14130F;color:#fff"><div class="n">900</div><div class="h">#14130F</div></div>
  </div>
</div>
</body>
</html>
