<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Brand colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 22px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: 6px; padding: 10px; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid rgba(0,0,0,0.06); }
  .sw .n { font-family: 'Inter'; font-size: 11px; font-weight: 500; }
  .sw .h { font-family: 'JetBrains Mono'; font-size: 10px; opacity: 0.75; margin-top: 2px; }
  .label-row { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .ttl { font-size: 13px; font-weight: 600; }
  .sub { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="card">
  <div class="label-row"><div class="ttl">Accent — muted teal</div><div class="sub">Confident, not loud</div></div>
  <div class="grid">
    <div class="sw" style="background:#ECF6F5;color:#0E2D2A"><div class="n">50</div><div class="h">#ECF6F5</div></div>
    <div class="sw" style="background:#D2EAE7;color:#0E2D2A"><div class="n">100</div><div class="h">#D2EAE7</div></div>
    <div class="sw" style="background:#A6D5CF;color:#0E2D2A"><div class="n">200</div><div class="h">#A6D5CF</div></div>
    <div class="sw" style="background:#6FB6AE;color:#0E2D2A"><div class="n">300</div><div class="h">#6FB6AE</div></div>
    <div class="sw" style="background:#3F968D;color:#fff"><div class="n">400 ◆</div><div class="h">#3F968D</div></div>
    <div class="sw" style="background:#2A7B73;color:#fff"><div class="n">500</div><div class="h">#2A7B73</div></div>
    <div class="sw" style="background:#1F635D;color:#fff"><div class="n">600</div><div class="h">#1F635D</div></div>
    <div class="sw" style="background:#184E49;color:#fff"><div class="n">700</div><div class="h">#184E49</div></div>
    <div class="sw" style="background:#133D39;color:#fff"><div class="n">800</div><div class="h">#133D39</div></div>
    <div class="sw" style="background:#0E2D2A;color:#fff"><div class="n">900</div><div class="h">#0E2D2A</div></div>
  </div>
</div>
</body>
</html>
