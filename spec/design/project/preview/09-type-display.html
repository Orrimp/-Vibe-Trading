<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Type display</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; min-width: 80px; }
  .h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
</style>
</head>
<body>
<div class="card">
  <div class="stack">
    <div class="row"><div class="meta">Display 32</div><div class="h1">Markets, seen clearly.</div></div>
    <div class="row"><div class="meta">H1 24</div><div class="h2">Today's positions</div></div>
    <div class="row"><div class="meta">H2 18</div><div class="h3">Order book — NVDA</div></div>
  </div>
</div>
</body>
</html>
