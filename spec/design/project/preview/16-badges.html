<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Badges & tags</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lbl { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; min-width: 70px; }
  .b { font-family: 'Inter'; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; line-height: 1.4; display: inline-flex; align-items: center; gap: 4px; }
  .pill { border-radius: 999px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .num { font-family: 'JetBrains Mono'; font-variant-numeric: tabular-nums; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="lbl">Status</div>
    <div class="b" style="background:#E9F0E7;color:#3a5538"><div class="dot" style="background:#6E9B6A"></div>Filled</div>
    <div class="b" style="background:#F5E5DD;color:#7a3f29"><div class="dot" style="background:#C97B5E"></div>Rejected</div>
    <div class="b" style="background:#F6ECD3;color:#6f5310"><div class="dot" style="background:#D4A24A"></div>Working</div>
    <div class="b" style="background:#E4ECF5;color:#2f4d72"><div class="dot" style="background:#5E84B4"></div>Queued</div>
  </div>
  <div class="row"><div class="lbl">Tags</div>
    <div class="b pill" style="background:#EFEBE3;color:#34322C">tech</div>
    <div class="b pill" style="background:#EFEBE3;color:#34322C">large-cap</div>
    <div class="b pill" style="background:#D2EAE7;color:#184E49">AI signal</div>
  </div>
  <div class="row"><div class="lbl">Counter</div>
    <div class="b num pill" style="background:#34322C;color:#FBFAF7">12</div>
    <div class="b num pill" style="background:#3F968D;color:#fff">3 new</div>
    <div class="b num pill" style="background:#C97B5E;color:#fff">!</div>
  </div>
</div>
</body>
</html>
