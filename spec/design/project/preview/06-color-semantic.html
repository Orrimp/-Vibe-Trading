<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Semantic colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .sw { border-radius: 6px; padding: 10px; height: 70px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(0,0,0,0.06); }
  .label { font-family: 'Inter'; font-size: 11px; font-weight: 600; }
  .h { font-family: 'JetBrains Mono'; font-size: 10px; opacity: 0.85; }
  .soft { height: 26px; border-radius: 4px; padding: 0 8px; display: flex; align-items: center; font-family: 'JetBrains Mono'; font-size: 10px; }
  .ttl { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="ttl">Semantic — calm, not alarming</div>
  <div class="grid">
    <div class="stack">
      <div class="sw" style="background:#6E9B6A;color:#fff"><div class="label">Up · sage</div><div class="h">#6E9B6A</div></div>
      <div class="soft" style="background:#E9F0E7;color:#3a5538">+1.24%  Soft</div>
    </div>
    <div class="stack">
      <div class="sw" style="background:#C97B5E;color:#fff"><div class="label">Down · clay</div><div class="h">#C97B5E</div></div>
      <div class="soft" style="background:#F5E5DD;color:#7a3f29">−0.83%  Soft</div>
    </div>
    <div class="stack">
      <div class="sw" style="background:#D4A24A;color:#3a2a08"><div class="label">Warn · ochre</div><div class="h">#D4A24A</div></div>
      <div class="soft" style="background:#F6ECD3;color:#6f5310">Limit reached</div>
    </div>
    <div class="stack">
      <div class="sw" style="background:#5E84B4;color:#fff"><div class="label">Info · slate-blue</div><div class="h">#5E84B4</div></div>
      <div class="soft" style="background:#E4ECF5;color:#2f4d72">Lumen suggests</div>
    </div>
  </div>
</div>
</body>
</html>
