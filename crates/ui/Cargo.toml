[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# T908 — the standalone `cockpit` bin is fixtures-only.  The
# `required-features = ["fixtures"]` gate makes
# `cargo run --bin cockpit --features live` fail at the cargo level
# with a "target requires the features: fixtures" error, redirecting
# the operator to `cargo run --bin cockpit_live --features live`
# (the unified agent+cockpit binary).  Builds with `--features
# fixtures,live` (or `--all-features`) still compile cleanly because
# the bin source itself gates the compile-time deprecation message
# on the *combination* live+!fixtures, not on `live` alone — see
# `src/bin/cockpit.rs`.
[[bin]]
name = "cockpit"
path = "src/bin/cockpit.rs"
required-features = ["fixtures"]

# ui-gallery-bin v0.1 (T01) — widget gallery binary for visual
# regression testing and operator review. Fixtures-only: no `live`
# dep, no window required in --smoke mode. See spec/ui-gallery-bin/.
[[bin]]
name = "ui-gallery"
path = "src/bin/ui_gallery.rs"
required-features = ["fixtures"]

# `cockpit_live` — unified agent + iced cockpit binary (T904 /
# live-cockpit-unified).  Builds a multi-thread tokio runtime on a
# side thread, hosts `agent::runtime::run` there, and runs iced on
# the main thread (macOS forces GUI on main).  `required-features =
# ["live"]` so a default `cargo build -p ui` does not pull the
# `agent` dep tree; operators opt in with
# `cargo run -p ui --features live --bin cockpit_live`.
[[bin]]
name = "cockpit_live"
path = "src/bin/cockpit_live.rs"
required-features = ["live"]

# Phase 4 (T1803) — `viewer` binary. Read-only backtest report
# viewer (CLI-arg-driven). Builds without `--features live` (no
# agent / audit / tokio dep) — the viewer is offline by
# construction. `clap` + `reports` are required deps so the
# default `cargo build -p ui` resolves the bin.
[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"

[[bench]]
name = "activity_tape"
harness = false

[dependencies]
trading_core = { path = "../core" }
# lab-yahoo-realdata T-C3.6 / T-AR1 — `data` crate for Yahoo parquet reader.
# Optional dep gated behind the `yahoo` feature so default builds (fixtures,
# live) do not pull the polars / parquet dep tree (R-NR.7 / H6).
# `yahoo-online` is NOT pulled here — fetching is CLI-only (Q8 / T-AR7).
data = { path = "../data", optional = true }
# Phase 4 (T1803/T1808/T1810) — viewer bin reads `reports::parse` +
# `reports::csv_artifacts::read_equity_csv` over committed report
# bodies. Read-only consumer; no write-path coupling.
reports = { path = "../reports" }
# ADR-0030 / T-D-14 — in-process backtest runner for the Lab Run button.
# The `ui` crate depends on `backtest` to call `engine::run_scenario`.
# This is the only cross-crate edge added by Phase A of ui-rethink-phase-a-lab;
# no other new edges are permitted (see ADR-0030 § Consequences).
backtest = { path = "../backtest" }
rust_decimal_macros.workspace = true
rand = { workspace = true }
rand_chacha = { workspace = true }
# cockpit-training-control T-D-N14 — PID liveness check (Unix: kill(pid, 0)).
libc = "0.2"
# NOTE: The `audit` dep is intentionally not wired in Week 1. The cockpit
# runs against `ui::fixtures` for T13–T20 and the real `audit::query` surface
# (T07) has not landed yet. T32 (Week 2) adds `audit = { path = "../audit" }`
# and swaps the Subscription from fixtures to live ledger reads.
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rust_decimal.workspace = true
time.workspace = true
smol_str.workspace = true
# Phase 4 (T1803) — viewer bin uses `clap::Parser`. Promoted to a
# non-optional dep so the default `cargo build -p ui` resolves the
# bin without requiring `--features live`.
clap = { workspace = true }

# iced — GUI framework. Pinned explicitly per ui-designer constraint.
# Do NOT use a range. Update in lockstep across ui/cockpit/viewer.
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "advanced", "canvas"] }

# iced_aw was dropped 2026-05-16 (ui-drop-iced-aw v0.1) to decouple
# from third-party iced ecosystem cadence (iced_aw locked at 0.14;
# transitively pulled Redhawk18/iced_fonts). The 3 cherry-picked
# widgets are now: (a) spinner — self-replaced by
# widgets/throttled_spinner.rs (pre-existing fork from
# iced-aw-cherry-pick cycle); (b) badge — native Container+Text in
# widgets/strategies.rs::status_badge_cell; (c) date_picker — was
# smoke-test demo only per viewer bin docstring, removed without
# replacement (v1.11 chart-x-axis-local-time may roll a real date
# input later). See spec/ui-drop-iced-aw/feature.md.

# `live` feature deps — Week 2 (T32). Only enabled when wiring the cockpit
# against the real `agent::EventBus`. Pinned like iced to keep the live
# path reproducible; the bus surface is a handoff contract (see
# spec/reports/dev-week2-broadcast-api-2026-04-18.md).
agent = { path = "../agent", optional = true }
audit = { path = "../audit", optional = true }
# Phase D+ (ui-rethink-phase-d-trail-followup T-D-N1) — `reflection` is an
# optional dep gated behind the existing `live` feature stanza (same shape as
# `agent` and `audit` above). The `ui` crate's default build (fixtures, viewer)
# never sees `reflection`; only `--features live` pulls it in. This satisfies
# ADR-0031 "zero new architecture edges" because `ui → reflection` under
# `--features live` is structurally equivalent to the existing
# `ui → agent → reflection` transitive edge (agent already re-exports reflection).
reflection = { path = "../reflection", optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
# T904 (live-cockpit-unified) — additional deps for the `cockpit_live`
# unified binary.  Same `live`-gated stanza so default builds skip them.
tokio-util = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# NOTE (ui-session-journal-iced-tester v0.1): we do NOT add a direct
# `iced_tester` dep here. iced 0.14's `iced::Application::run()`
# (iced-0.14.0/src/application.rs:198) auto-wraps the program with
# `iced_tester::attach()` when `iced/tester` is enabled. Pulling the
# crate happens transitively through the `record-tests` feature
# below (`iced/tester` → `dep:iced_tester` inside iced's manifest).

[dev-dependencies]
criterion.workspace = true
insta = { version = "=1.47.2", features = ["yaml"] }
# T32 integration test: needs tokio runtime to drive the live subscription.
tokio = { workspace = true }
futures = { workspace = true }
agent = { path = "../agent" }
# T906 stitch (Wave 3 follow-up — orchestrator-spawned 2026-05-01):
# the `cockpit_live_kill_button_writes_audit` integration test
# constructs an in-memory `audit::Ledger` + `KillSwitch::with_audit(...)`
# fixture and asserts the T809 dual-write lands when the kill button is
# driven through `ui::state::update`.  Dev-only deps; the production
# build pulls these via the `live` feature.
audit = { path = "../audit" }
tempfile = { workspace = true }

# ui-test-harness-bootstrap v0.1 (T4011) — `iced_test` 0.14 ships with
# the workspace-pinned iced 0.14.0; no version skew risk. `image-compare`
# (MIT/Apache, NOT AGPL `dssim-core`) provides the perceptual-diff PNG
# under R6 (Q8 operator-lock). Both are dev-only — never reachable from
# production. See `spec/ui-test-harness-bootstrap/feature.md` Design §.
iced_test = "=0.14.0"
image-compare = "=0.4"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
# ui-quality-gate-overhaul M1-C (T-M1-C-1) — proptest layout invariants
# at `tests/layout_invariants.rs`. Workspace pin already at
# `Cargo.toml:77` (`proptest = { version = "1.6" }`); dev-only on the
# `ui` crate per architect's H-A3 falsifier resolution
# (`spec/ui-quality-gate-overhaul/feature.md ## H-A3`).
proptest = { workspace = true }

[features]
# Default features — operator's everyday-use bundle. Includes `live` (real
# broadcast-bus subscription + cockpit_live binary deps) and `yahoo` (Yahoo
# Finance parquet cache reader for the Lab Source toggle). This means
# `cargo run -p ui --bin cockpit_live` Just Works without `--features` flags.
#
# Builds that explicitly want a minimal surface can opt out with
# `--no-default-features` and then re-enable individual features as needed
# (e.g. `--no-default-features --features fixtures` for the gallery-only bin).
#
# 2026-05-25: promoted from explicit-opt-in to default per operator request.
default = ["live", "yahoo"]

# `fixtures` — enables ui::fixtures with deterministic in-memory generators.
# Used by `cargo run --bin cockpit --features fixtures` to smoke-test the
# cockpit without a running agent. `fixtures` is also auto-enabled under
# `#[cfg(test)]` via a gate in `lib.rs` so snapshot tests see the module
# without needing `--features fixtures` on every invocation.
fixtures = []

# `yahoo` — enables the Yahoo Finance parquet cache reader + auto-fetch
# path in `lab::runner::preload_yahoo_bars`. When this feature is absent,
# toggling the Source = YahooCache and pressing Run returns a friendly
# error directing the operator to rebuild with `--features yahoo`.
#
# Pulls `data/yahoo` (parquet reader via polars) AND `data/yahoo-online`
# (auto-fetch on cache miss via `YahooBarSource::fetch_and_cache`).
# Operator decision 2026-05-25: when the cache is empty, the cockpit
# fetches online in-flight instead of erroring out — first Run takes
# 30-60 s for the network round-trip, subsequent Runs hit the cache.
yahoo = ["dep:data", "data/yahoo", "data/yahoo-online"]

# `render-debug` — ui-quality-gate-overhaul M2-A + M2-B opt-in. Composes
# two surfaces under one flag per architect Q7 resolution
# (`spec/ui-quality-gate-overhaul/feature.md ## Q7`):
#
#   - **M2-A:** `#[cfg(feature = "render-debug")]`-gated
#     `tracing::trace_span!` instrumentation on widget `panel(...)`,
#     `loading_with_spinner(...)`, and `strategies::id_cell(...)`.
#     `tracing` is already a non-optional production dep
#     (line 58 `tracing.workspace = true`); the feature only gates
#     the call sites, not the dep itself. Default builds compile the
#     `#[cfg]` blocks away entirely — zero runtime cost.
#   - **M2-B:** `#[cfg(feature = "render-debug")]`-gated
#     `widgets::debug_renderer` module (newtype wrapping
#     `iced_tiny_skia::Renderer` that intercepts zero-dim Quads with
#     widget-context panics).
#
# Operator triage workflow: `cargo build -p ui --bin cockpit
# --features fixtures,render-debug && RUST_LOG=ui=trace cargo run -p
# ui --bin cockpit --features fixtures,render-debug`. Build-time-only
# per architect Q3 (no `IcedSettings { renderer: enum {...} }` runtime
# toggle ships).
#
# Pulls `tracing-subscriber` (optional dep, line 93) so the standalone
# `cockpit` bin can initialise an fmt subscriber inside its `main()`.
# The `live`-only `cockpit_live` bin already initialises its own
# subscriber and so does not duplicate this on a default + render-debug
# build (the `try_init` call in `cockpit.rs:main` is idempotent).
render-debug = ["dep:tracing-subscriber"]

# `live` — enables the real broadcast-bus subscription (T32). Without this
# feature the `ui::live` module is not compiled; the cockpit falls back to
# `fixtures` (or an empty subscription).
#
# T904 (live-cockpit-unified) extends `live` to also cover the deps
# needed by the unified `cockpit_live` binary: `audit` (ledger
# bootstrap + uptime open/close), `tokio-util` (CancellationToken),
# `anyhow`/`clap`/`tracing-subscriber`/`uuid` (binary boilerplate).
# Strategy registry construction is delegated to `agent::runtime::build_registry`
# so the `ui` crate has no direct `strategy` dependency (architecture rule:
# ui depends only on `core`, `audit`, and `agent`).
# `cockpit_live` declares `required-features = ["live"]` so this stanza
# is the single source of truth for everything the unified bin needs.
live = [
    "dep:agent",
    "dep:audit",
    # Phase D+ (ui-rethink-phase-d-trail-followup T-D-N1) — reflection pulled in
    # under `live` so the trail-mirror Subscription bridge can access
    # `reflection::trail_mirror::TrailMirrorHandle` and `TrailMirrorTick`.
    "dep:reflection",
    "dep:tokio",
    "dep:futures",
    "dep:async-stream",
    "dep:tokio-util",
    "dep:anyhow",
    "dep:tracing-subscriber",
    "dep:uuid",
]

# `in_process_cron` — pass-through to `agent`'s opt-in cron scheduler
# feature (T810).  Per [Design Q5](../../spec/features/live-cockpit-unified.md#q5-in-process-cron-t810-interaction)
# the gate is exactly the same as the headless `trading` bin: default
# off, opt in with `--features in_process_cron`.  We force `live` too
# because the cron scheduler is only meaningful when the agent runtime
# is wired (i.e. inside `cockpit_live`); enabling cron without `live`
# would compile to no behavior.
in_process_cron = ["live", "agent/in_process_cron"]

# `record-tests` — ui-session-journal-iced-tester v0.1 (T01). Enables
# `iced_tester::attach()` recorder overlay in `cockpit_live` and
# the `iced_test::run` replay path in `tests/journal_replay.rs`. Off
# by default; production builds with `--features live` alone do NOT
# pull `iced_tester` (verify with `cargo tree -p ui --features live |
# grep iced_tester`). Pulls iced's own `tester` + `selector` +
# `strict-assertions` features to align renderer invariants.
# See `spec/ui-session-journal-iced-tester/feature.md ## Design`.
record-tests = [
    "iced/tester",
    "iced/selector",
    "iced/strict-assertions",
]
