[package]
name = "llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace siblings (v2 — LLM strategy)
cost = { path = "../cost" }
# T1916 enhancement (M5, pass 4) — `BudgetedProvider` posts
# `BudgetEventKind::{DegradeToQuickThink,Block}` audit memos via
# `audit::journal::post_llm_budget_event` when an `audit_ledger` is
# wired through `BudgetedProvider::with_audit_ledger`.
audit = { path = "../audit" }

# Async + trait shape
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
async-trait = { workspace = true }

# HTTP (used by `LlmError::Network(reqwest::Error)`; provider impls land in T1902+)
reqwest = { workspace = true, features = ["json"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Numerics (`LlmError::BudgetExceeded` carries `Decimal`)
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }

# Tool-use JSON Schema validation (R5 / Q4e)
jsonschema = { version = "0.30", default-features = false }

# IDs
uuid = { workspace = true, features = ["serde", "v4"] }

# Observability
tracing = { workspace = true }
metrics = { workspace = true }

# Errors
thiserror = { workspace = true }

# Retry jitter (T1902 — full-jitter exponential backoff per Q9c)
rand = { workspace = true }

# M6 record/replay storage (T1919-T1922).
# Replay DB lives at `data/llm-replay.db` (runtime) or
# `crates/llm/fixtures/replay-v1.db` (fixture, committed). WAL + per-process
# tokio Mutex for the writer half per Design § Q8e. The `migrate` feature is
# required for `sqlx::migrate!("./migrations")` on RecordingProvider::open
# + ReplayProvider::open.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
# T1920 — `request_hash` SHA-256 over canonical JSON. Workspace-level dep
# already pulled in via the audit crate's hash helpers; reused here for the
# replay-cache key. Canonical-JSON serialisation is in-crate (deep-sort map
# keys) — see crates/llm/src/replay.rs ## divergence note (the design's
# strawman `serde-canonical-json` crate is not in the offline lockfile and
# v2.0.0 ships sandboxed).
sha2 = { workspace = true }
# T1921 — RFC-3339 fractional ISO timestamps for `recorded_at` column.
time = { workspace = true }
# T1923 — `llm-smoke` binary CLI flag parsing (`--mode {live|paper|research}`,
# `--reset`).
clap = { workspace = true }
# T1923 — `llm-smoke` binary trace output (`tracing_subscriber::fmt`).
tracing-subscriber = { workspace = true }
# T-RED-D1 — regex rule set for the tracing-Layer redactor (D-RED-1 / D-RED-3).
regex = { workspace = true }
# T1921 — async filesystem prep (`tokio::fs::create_dir_all` for the
# replay DB's parent directory before `SqlitePool::connect` opens it).
# Already pulled in via the `tokio` workspace dep; no new line.

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "sync"] }
rust_decimal_macros = { workspace = true }
wiremock = { workspace = true }
# T1909 — assert counter increments via `metrics-util::debugging::DebuggingRecorder`.
metrics-util = { version = "0.19" }
# T1914 — temp-dir scaffolding for the auth-key tests.
tempfile = { workspace = true }
