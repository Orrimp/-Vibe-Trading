[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "trading"
path = "src/main.rs"

[lib]
name = "agent"
path = "src/lib.rs"

[features]
# T810 — operator success reports (R12.1b / Q7).  When enabled the agent
# spawns an in-process tokio cron scheduler that runs the reports binary
# at the configured cron expression (default Mondays 09:00).  Default
# build is **unchanged** — the cron scheduler is opt-in only.
in_process_cron = ["dep:tokio-cron-scheduler", "dep:reports"]
# T-D-14 — propagate ForecastEmitted audit-tick feature to strategy/forecast.
# Enables `TcnForecaster::with_ledger` and the two emit sites in tcn.rs.
forecast-audit-tick = ["strategy/forecast-audit-tick"]

[dependencies]
trading_core = { path = "../core" }
data = { path = "../data" }
features = { path = "../features" }
risk = { path = "../risk" }
strategy = { path = "../strategy" }
exec = { path = "../exec" }
audit = { path = "../audit" }
reflection = { path = "../reflection" }
cost = { path = "../cost" }
# T1928 (pass 6) — `LlmConfig` is hoisted into agent::config from the
# llm crate (re-export). T1931 wires the factory at agent boot when
# `cfg.llm.enabled = true` (default false in v2.0.0).
llm = { path = "../llm" }
backtest = { path = "../backtest" }
reports = { path = "../reports", optional = true }
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
smol_str.workspace = true
notify.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
time.workspace = true
config.workspace = true
toml.workspace = true
clap.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# T810 — optional in-process cron scheduler.  Pulled in only when the
# `in_process_cron` feature is enabled; default build is unchanged.
tokio-cron-scheduler = { version = "0.15", optional = true }

[[bench]]
name = "activity_audit"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile.workspace = true
reqwest = { workspace = true, features = ["json"] }
async-trait.workspace = true
# T1409 — `tokio::time::advance` / `pause` / `start_paused` are gated
# behind tokio's `test-util` feature.  The watchdog tests pause the
# tokio clock to control the 1Hz scan interval deterministically.
tokio = { workspace = true, features = ["test-util"] }
# T1414 — V7 Coinbase outage isolation integration test needs
# `data::MockFeed`, which lives behind the `fixtures` feature flag
# (mirrors the production gating from T1407).
data = { path = "../data", features = ["fixtures"] }
