[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "trading"
path = "src/main.rs"

[lib]
name = "agent"
path = "src/lib.rs"

[features]
# T810 — operator success reports (R12.1b / Q7).  When enabled the agent
# spawns an in-process tokio cron scheduler that runs the reports binary
# at the configured cron expression (default Mondays 09:00).  Default
# build is **unchanged** — the cron scheduler is opt-in only.
in_process_cron = ["dep:tokio-cron-scheduler", "dep:reports"]

[dependencies]
trading_core = { path = "../core" }
data = { path = "../data" }
features = { path = "../features" }
risk = { path = "../risk" }
strategy = { path = "../strategy" }
exec = { path = "../exec" }
audit = { path = "../audit" }
cost = { path = "../cost" }
backtest = { path = "../backtest" }
reports = { path = "../reports", optional = true }
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
smol_str.workspace = true
notify.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
time.workspace = true
config.workspace = true
toml.workspace = true
clap.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# T810 — optional in-process cron scheduler.  Pulled in only when the
# `in_process_cron` feature is enabled; default build is unchanged.
tokio-cron-scheduler = { version = "0.15", optional = true }

[dev-dependencies]
tempfile.workspace = true
reqwest = { workspace = true, features = ["json"] }
