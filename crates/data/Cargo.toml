[package]
name = "data"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fetch_binance_klines"
path = "src/bin/fetch_binance_klines.rs"

[dependencies]
trading_core = { path = "../core" }
audit = { path = "../audit" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
rust_decimal.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
polars.workspace = true
async-stream.workspace = true
metrics.workspace = true
rust_decimal_macros.workspace = true
clap.workspace = true
anyhow.workspace = true
sha2.workspace = true
toml.workspace = true

tokio-util.workspace = true

[features]
# `fixtures` exposes `MockFeed` and other test-harness scaffolding to other
# crates' integration tests (T1407 / Q10). Production binaries do not enable
# this feature, so the harness is excluded from `cargo build --release`.
fixtures = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
mockall = { version = "0.13" }
wiremock.workspace = true
rust_decimal_macros.workspace = true
time.workspace = true
criterion.workspace = true

[[bench]]
name = "bar_aggregator"
harness = false
