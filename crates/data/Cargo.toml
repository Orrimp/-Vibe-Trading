[package]
name = "data"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fetch_binance_klines"
path = "src/bin/fetch_binance_klines.rs"

[[bin]]
name = "fetch_yahoo_klines"
path = "src/bin/fetch_yahoo_klines.rs"
required-features = ["yahoo-online"]

[dependencies]
trading_core = { path = "../core" }
audit = { path = "../audit" }
# T-RED-D12 (v2-1-tracing-layer-redactor) — llm::tracing_init::install_global
# for subscriber migration across fetch_binance_klines + fetch_yahoo_klines bins.
llm = { path = "../llm" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
rust_decimal.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
polars.workspace = true
async-stream.workspace = true
metrics.workspace = true
rust_decimal_macros.workspace = true
clap.workspace = true
anyhow.workspace = true
sha2.workspace = true
toml.workspace = true
smol_str.workspace = true

tokio-util.workspace = true
rand.workspace = true
rand_chacha.workspace = true
yahoo_finance_api = { workspace = true, optional = true }

[features]
# `fixtures` exposes `MockFeed` and other test-harness scaffolding to other
# crates' integration tests (T1407 / Q10). Production binaries do not enable
# this feature, so the harness is excluded from `cargo build --release`.
fixtures = []

# v0.1.0 — Yahoo Finance read-path + parquet cache.
# Enables `pub mod yahoo` and the `binance_to_yahoo_ticker` helper.
# No network required — reads from data/yahoo/ cache only.
yahoo = ["dep:yahoo_finance_api"]

# Adds the async `fetch_and_cache` method; used by the `fetch_yahoo_klines`
# CLI only. The cockpit reads the cache and never fetches directly (K10).
# tokio and reqwest are already non-optional workspace deps in this crate,
# so we only gate on the yahoo dep here.
yahoo-online = ["yahoo"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
mockall = { version = "0.13" }
wiremock.workspace = true
rust_decimal_macros.workspace = true
time.workspace = true
criterion.workspace = true

[[bench]]
name = "bar_aggregator"
harness = false
