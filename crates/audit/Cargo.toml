[package]
name = "audit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
trading_core = { path = "../core" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
time.workspace = true
uuid.workspace = true
tokio.workspace = true
smol_str.workspace = true
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# T1005 V1/V4/V7 — re-uses the test-only fixture
# `crates/reports/tests/fixtures/build_ledger_with_open_positions_7d.rs`
# via `#[path]`; the fixture seeds fee jitter from `ChaCha20Rng` (R6
# determinism), so dev-deps mirror the workspace's `rand` / `rand_chacha`
# choices already pulled in by `crates/reports`'s dev-deps.
rand.workspace = true
rand_chacha.workspace = true
# T1105 V8 — universe coverage smoke. Parses `config/agent.toml`'s
# `[funding].universe` array directly so the test asserts the chart of
# accounts contains every symbol the agent is configured to trade. We
# cannot depend on the `agent` crate's `Config` reader because `agent`
# depends on `audit` (cycle); a local typed deserialize over the same
# TOML key path satisfies the V8 acceptance shape without the cycle.
toml.workspace = true
# Phase 5 (T1902) — `insta` is needed for the two new audit-row
# snapshot baselines (`strategy_events__strategy_paused_row.snap`
# and `strategy_events__risk_veto_overridden_row.snap`) that lock the
# format of the operator-write strategy_events rows (Q10).
insta = { version = "1.42", features = ["yaml"] }
