[package]
name = "backtest"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "backtest"
path = "src/main.rs"

[[bin]]
name = "threshold_sweep"
path = "src/bin/threshold_sweep.rs"
required-features = ["candle", "realdata"]

[[bin]]
name = "run_yahoo_sma"
path = "src/bin/run_yahoo_sma.rs"
required-features = ["yahoo"]

[[bin]]
name = "monte_carlo"
path = "src/bin/monte_carlo.rs"

[[bin]]
name = "param_robustness_sweep"
path = "src/bin/param_robustness_sweep.rs"

[[example]]
name = "passive_baseline_equity"
path = "examples/passive_baseline_equity.rs"
required-features = ["realdata"]

[features]
# Enable real TCN-weights backtest scenarios (top10-*-tcn-overlay-weights).
# CORRECTED 2026-11-08 (bug-log #163). This comment used to read "Requires
# `--features candle` at build time; without it those scenarios emit a clear
# compile-time-gated error rather than silently falling back." The second half
# is still true; the first is NOT. Line 63 below depends on `strategy` with
# `features = ["forecast"]` UNCONDITIONALLY, and `strategy/forecast` pulls
# `forecast/candle` — so candle-core is compiled in every default build (17
# `libcandle_core*` rlibs in `target/debug/deps`) and this feature enables
# nothing new in the dependency graph.
#
# What it still does: flips this crate's own 7 `#[cfg(feature = "candle")]`
# sites (scenarios/{tcn,patchtst}_overlay_weights.rs, scenarios/threshold_sweep.rs)
# and unlocks the two `required-features = ["candle", "realdata"]` targets, which
# `cargo test` otherwise skips in SILENCE. The consequence is that CI pays the ML
# compile cost on every run and gets none of the ML-gated scenarios or tests.
# Enabling it in CI is an operator decision, tracked in bug-log #163; the
# inventory of what that costs is declared in
# scripts/feature_gated_targets_check.py.
candle = ["strategy/forecast"]
# Enable real-Binance-data backtest scenarios (top10-*-tcn-overlay-realdata).
# Requires data/binance/REVISION.toml to be present at runtime.
# See ADR-0032 and spec/v1/backtest-real-binance-data/feature.md.
realdata = ["dep:toml", "dep:polars"]
# Enable Yahoo Finance parquet-cache read path (lab-yahoo-realdata v0.1.1).
# Enables data/src/yahoo.rs via the `data` crate's `yahoo` feature.
# No network required — reads from data/yahoo/ cache only.
yahoo = ["data/yahoo"]

[dependencies.toml]
workspace = true
optional = true

[dependencies.polars]
workspace = true
optional = true

[dependencies]
trading_core = { path = "../core" }
# T-RED-D11/D12 (v2-1-tracing-layer-redactor) — llm::tracing_init::install_global
# for subscriber migration across backtest / threshold_sweep / run_yahoo_sma bins.
llm = { path = "../llm" }
data = { path = "../data" }
features = { path = "../features" }
strategy = { path = "../strategy", features = ["forecast"] }
risk = { path = "../risk" }
audit = { path = "../audit" }
exec = { path = "../exec" }
cost = { path = "../cost" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust_decimal.workspace = true
rust_decimal_macros = { workspace = true }
async-trait.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["full"] }
rand.workspace = true
rand_chacha.workspace = true
anyhow.workspace = true
rayon = { workspace = true }
pollster = { workspace = true }
time.workspace = true
sha2.workspace = true
clap.workspace = true
smol_str.workspace = true
# Bug #64 D.1.1 attempt-3 / ADR-0050 § D2: CancellationToken as canonical
# cooperative-cancellation primitive. `rt` feature is the minimal surface
# needed for `tokio_util::sync::CancellationToken`; default-features = false
# keeps the workspace lean (avoids pulling codec/io).
tokio-util = { workspace = true }

[[test]]
name = "equity_companion_roundtrip"
path = "tests/equity_companion_roundtrip.rs"

[[test]]
name = "threshold_sweep_readonly"
path = "tests/threshold_sweep_readonly.rs"
required-features = ["candle", "realdata"]

[[test]]
name = "montecarlo_e2e"
path = "tests/montecarlo_e2e.rs"

[[test]]
name = "param_sweep_e2e"
path = "tests/param_sweep_e2e.rs"

[[test]]
name = "run_yahoo_sma_ticker_flag"
path = "tests/run_yahoo_sma_ticker_flag.rs"
required-features = ["yahoo"]

# F8 robustness-bootstrap e2e test (ADR-0063 § D-T5.2).
[[test]]
name = "robustness_bootstrap_bites"
path = "tests/robustness_bootstrap_bites.rs"

# P2 corpus expansion — multi-corpus verdict-rerun harness (ADR-0084 D4).
# Needs `realdata` (resolve_dvol_override / DvolDataSource) + `yahoo`
# (load_macro_regime_series / YahooBarSource) simultaneously.
[[test]]
name = "p2_verdict_rerun"
path = "tests/p2_verdict_rerun.rs"
required-features = ["realdata", "yahoo"]

[dev-dependencies]
criterion.workspace = true
cost = { path = "../cost" }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
data = { path = "../data" }
polars.workspace = true
# M-TEST-1 (backtest-equity-companion v0.1.0): test-only edge so the round-trip
# test can call the canonical `reports::csv_artifacts::read_equity_csv` reader.
# A production edge is NOT justified (the companion writer needs no reports API);
# this dev edge is acyclic (`reports` has no dev-dep on `backtest`).
reports = { path = "../reports" }
