[package]
name = "backtest"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "backtest"
path = "src/main.rs"

[[bin]]
name = "threshold_sweep"
path = "src/bin/threshold_sweep.rs"
required-features = ["candle", "realdata"]

[[bin]]
name = "run_yahoo_sma"
path = "src/bin/run_yahoo_sma.rs"
required-features = ["yahoo"]

[features]
# Enable real TCN-weights backtest scenarios (top10-*-tcn-overlay-weights).
# Requires `--features candle` at build time; without it those scenarios emit
# a clear compile-time-gated error rather than silently falling back.
candle = ["strategy/forecast"]
# Enable real-Binance-data backtest scenarios (top10-*-tcn-overlay-realdata).
# Requires data/binance/REVISION.toml to be present at runtime.
# See ADR-0032 and spec/backtest-real-binance-data/feature.md.
realdata = ["dep:toml"]
# Enable Yahoo Finance parquet-cache read path (lab-yahoo-realdata v0.1.1).
# Enables data/src/yahoo.rs via the `data` crate's `yahoo` feature.
# No network required — reads from data/yahoo/ cache only.
yahoo = ["data/yahoo"]

[dependencies.toml]
workspace = true
optional = true

[dependencies]
trading_core = { path = "../core" }
data = { path = "../data" }
features = { path = "../features" }
strategy = { path = "../strategy", features = ["forecast"] }
risk = { path = "../risk" }
audit = { path = "../audit" }
exec = { path = "../exec" }
cost = { path = "../cost" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust_decimal.workspace = true
rust_decimal_macros = { workspace = true }
async-trait.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["full"] }
rand.workspace = true
rand_chacha.workspace = true
anyhow.workspace = true
rayon = { workspace = true }
pollster = { workspace = true }
time.workspace = true
sha2.workspace = true
clap.workspace = true
smol_str.workspace = true

[[test]]
name = "threshold_sweep_readonly"
path = "tests/threshold_sweep_readonly.rs"
required-features = ["candle", "realdata"]

[dev-dependencies]
criterion.workspace = true
cost = { path = "../cost" }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
data = { path = "../data" }
polars.workspace = true
