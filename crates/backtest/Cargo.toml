[package]
name = "backtest"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "backtest"
path = "src/main.rs"

[features]
# Enable real TCN-weights backtest scenarios (top10-*-tcn-overlay-weights).
# Requires `--features candle` at build time; without it those scenarios emit
# a clear compile-time-gated error rather than silently falling back.
candle = ["strategy/forecast"]
# Enable real-Binance-data backtest scenarios (top10-*-tcn-overlay-realdata).
# Requires data/binance/REVISION.toml to be present at runtime.
# See ADR-0032 and spec/backtest-real-binance-data/feature.md.
realdata = ["dep:toml"]

[dependencies.toml]
workspace = true
optional = true

[dependencies]
trading_core = { path = "../core" }
data = { path = "../data" }
features = { path = "../features" }
strategy = { path = "../strategy", features = ["forecast"] }
risk = { path = "../risk" }
audit = { path = "../audit" }
exec = { path = "../exec" }
cost = { path = "../cost" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust_decimal.workspace = true
rust_decimal_macros = { workspace = true }
async-trait.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["full"] }
rand.workspace = true
rand_chacha.workspace = true
anyhow.workspace = true
time.workspace = true
sha2.workspace = true
clap.workspace = true
smol_str.workspace = true

[dev-dependencies]
criterion.workspace = true
cost = { path = "../cost" }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
data = { path = "../data" }
polars.workspace = true
