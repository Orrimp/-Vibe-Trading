[package]
name = "strategy"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enable the `forecast` crate dependency for `TcnSyncForecaster`.
# Requires `--features forecast` to enable the candle backend via forecast.
forecast = ["dep:forecast", "forecast/candle", "dep:candle-core"]
# Enable ForecastEmitted audit-tick tee on TcnForecaster (T-D-14 / decomp §5A).
# Requires the `forecast` feature. Propagates `audit-tick` to the forecast crate
# so `TcnForecaster::with_ledger` is available.
forecast-audit-tick = ["forecast", "forecast/audit-tick"]

[dependencies]
# Optional: TCN forecaster for tcn_overlay_momentum (v2.5)
forecast = { path = "../forecast", optional = true }
# Optional: candle-core for TcnSyncForecaster (pulled in by forecast feature)
candle-core = { version = "0.9", optional = true }
trading_core = { path = "../core" }
features = { path = "../features" }
audit = { path = "../audit" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
rust_decimal.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
smol_str.workspace = true
sha2.workspace = true

time.workspace = true
rust_decimal_macros.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
criterion.workspace = true
time.workspace = true

[[bench]]
name = "composed_strategies"
harness = false

[[bench]]
name = "cross_sectional"
harness = false

[[bench]]
name = "pairs_mean_reversion"
harness = false
