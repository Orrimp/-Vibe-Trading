[package]
name = "strategy"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enable the candle backend on the `forecast` crate for `TcnSyncForecaster`.
# `forecast` is now an unconditional dep (required by the Wave C regime
# dispatcher); this feature only gates the *candle* (ML inference) subset.
forecast = ["forecast/candle", "dep:candle-core"]
# Enable ForecastEmitted audit-tick tee on TcnForecaster (T-D-14 / decomp §5A).
# Requires the `forecast` feature. Propagates `audit-tick` to the forecast crate
# so `TcnForecaster::with_ledger` is available.
forecast-audit-tick = ["forecast", "forecast/audit-tick"]

[dependencies]
# Optional: TCN forecaster for tcn_overlay_momentum (v2.5).
# Also pulled in unconditionally for regime dispatcher (markov_switching module;
# no candle dep required — Wave C ADR-0049 § D3).
forecast = { path = "../forecast" }
# Optional: candle-core for TcnSyncForecaster (pulled in by forecast feature)
candle-core = { version = "0.9", optional = true }
trading_core = { path = "../core" }
features = { path = "../features" }
audit = { path = "../audit" }
# NOTE: llm, reflection, cost, uuid, tokio, pollster deps REMOVED per ADR-0041 D1.
# LlmForecasterStrategy (which used these) moved to crates/trader/.
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
rust_decimal.workspace = true
# NOTE: async-trait REMOVED per ADR-0041 D1 (only used in llm_forecaster, now in trader).
parking_lot.workspace = true
smol_str.workspace = true
sha2.workspace = true

time.workspace = true
rust_decimal_macros.workspace = true
# NOTE: rusqlite, clap, anyhow, tracing-subscriber REMOVED per ADR-0041 D1.
# These were only used by the llm_verdict bin + llm_forecaster module, now in trader.

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
proptest.workspace = true
criterion.workspace = true
time.workspace = true
pollster.workspace = true
rust_decimal.workspace = true
# v5-latency-slippage-sim R5 — e2e divergence test needs the backtest engine.
backtest = { path = "../backtest" }
# NOTE: uuid, wiremock, cost(dev), sqlx REMOVED per ADR-0041 D1
# (only used by llm_forecaster integration tests, now in crates/trader/).

# NOTE: llm_verdict bin + all llm_forecaster_* + llm_verdict_priority_tree tests
# MOVED to crates/trader/ per ADR-0041 D2. Entries removed from strategy here.

[[test]]
name = "tcn_overlay_tuned_builder"
path = "tests/tcn_overlay_tuned_builder.rs"
required-features = ["forecast"]

# Hygiene gate: every *_overlay.rs must have a matching *_end_to_end.rs test.
[[test]]
name = "overlay_hygiene_gate"
path = "tests/overlay_hygiene_gate.rs"

# v3-regime-classifier Wave C — K6 noop-fix gate (CLAUDE.md non-negotiable).
[[test]]
name = "regime_dispatcher_end_to_end"
path = "tests/regime_dispatcher_end_to_end.rs"

# v5-latency-slippage-sim R5 — baseline-equity-divergence e2e test (CLAUDE.md non-negotiable).
[[test]]
name = "latency_slippage_sim_e2e"
path = "tests/latency_slippage_sim_e2e.rs"

[[bench]]
name = "composed_strategies"
harness = false

[[bench]]
name = "cross_sectional"
harness = false

[[bench]]
name = "pairs_mean_reversion"
harness = false
