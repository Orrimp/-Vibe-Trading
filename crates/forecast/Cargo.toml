[package]
name = "forecast"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ForecastProvider trait + TCN forecaster (v2.5)"

# Checklist (CLAUDE.md / arch agent):
# - candle-core + candle-nn: CPU default; Metal gated behind 'metal' feature (T-D-4).
# - itertools: multi-symbol kmerge_by batching (T-D-3).
# - polars: parquet read for feature pipeline (T-D-2).
# - safetensors: checkpoint read/write (T-D-8).
# - sha2: weight SHA-256 for provenance (T-D-9).
# - rand_chacha: seeded RNG for training (T-D-10).
# - clap: CLI for train_tcn binary (T-D-8).
# - anyhow: error handling in binary (train_tcn.rs).

[features]
default = []
# Enable candle Metal backend (Apple Silicon only).
metal = ["candle-core/metal", "candle-nn/metal"]
# Enable candle feature (CPU); required for TCN forward pass.
candle = ["dep:candle-core", "dep:candle-nn"]
# Gate the optional audit::Ledger field on TcnForecaster and the
# ForecastEmitted broadcast tee (T-D-12 / decomp §5A). The `audit` crate is
# already an unconditional dep (train_tcn bin uses it); this feature gates
# only the tick-emit code path in TcnForecaster.
audit-tick = []

# `train_tcn` bin and `metal_cpu_drift` test depend on the candle-only `tcn`
# module + `FeatureTensor = Tensor`. Without `--features candle`,
# `FeatureTensor` resolves to `Vec<f32>` and these consumers fail to
# compile. Mirror the cockpit-bin pattern: gate them at the cargo-target
# level so default `cargo build` / `cargo test` skip them and they only
# build with `--features candle`.
[[bin]]
name = "train_tcn"
path = "src/bin/train_tcn.rs"
required-features = ["candle"]

[[bin]]
name = "forecast_distribution"
path = "src/bin/forecast_distribution.rs"
required-features = ["candle"]

[[bin]]
name = "sharpe_comparison"
path = "src/bin/sharpe_comparison.rs"

[[test]]
name = "metal_cpu_drift"
path = "tests/metal_cpu_drift.rs"
required-features = ["candle"]

# K5 golden-CLI snapshot (ADR-0034 § D9). Requires `candle` so the binary
# exists; uses `cargo run` internally.
[[test]]
name = "train_tcn_golden_cli"
path = "tests/train_tcn_golden_cli.rs"
required-features = ["candle"]

# T-D-N10 audit-emits integration tests.
[[test]]
name = "train_tcn_audit_emits"
path = "tests/train_tcn_audit_emits.rs"
required-features = ["candle"]

[[test]]
name = "train_tcn_no_audit_db_writes_nothing"
path = "tests/train_tcn_no_audit_db_writes_nothing.rs"
required-features = ["candle"]

[dependencies]
# Workspace siblings
trading_core = { path = "../core" }
replay-cache = { path = "../replay-cache" }
# Audit-DB sidecar for train_tcn --audit-db instrumentation (T-D-N10).
# Compiled in always; the Ledger is only opened at runtime when --audit-db
# is passed. Zero performance impact on normal training runs.
audit = { path = "../audit" }

# Async runtime for blocking audit writes in train_tcn's audit_writer helper.
tokio = { workspace = true, features = ["rt", "macros"] }

# Async trait
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Numerics
rust_decimal = { workspace = true }

# IDs
uuid = { workspace = true, features = ["serde", "v4"] }

# Time
time = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Data pipeline
polars = { workspace = true }
itertools = "0.14"

# Deep learning (optional; candle feature gate)
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }

# Checkpoint I/O
safetensors = "0.4"

# Hashing (provenance)
sha2 = { workspace = true }

# RNG (deterministic training)
rand = { workspace = true }
rand_chacha = { workspace = true }

# CLI (train_tcn binary)
anyhow = { workspace = true }
clap = { workspace = true }

# Config (train_tcn.toml)
toml = { workspace = true }

# Logging (train_tcn binary)
tracing-subscriber = { workspace = true }

# Temp dirs (sharpe_comparison binary)
tempfile = { workspace = true }

[dev-dependencies]
# tokio is already in [dependencies]; rt-multi-thread is added here for tests.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
rust_decimal_macros = { workspace = true }
proptest = { workspace = true }
# For T-D-N10 integration tests that open the audit.db directly without tokio.
rusqlite = { version = "0.32", features = ["bundled"] }
# For the no-audit-db walkdir assertion.
walkdir = "2"
# For T-D-N10 metadata JSON validation.
serde_json = { workspace = true }
