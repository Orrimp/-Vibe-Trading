[package]
name = "forecast"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ForecastProvider trait + TCN forecaster (v2.5)"

# Checklist (CLAUDE.md / arch agent):
# - candle-core + candle-nn: CPU default; Metal gated behind 'metal' feature (T-D-4).
# - itertools: multi-symbol kmerge_by batching (T-D-3).
# - polars: parquet read for feature pipeline (T-D-2).
# - safetensors: checkpoint read/write (T-D-8).
# - sha2: weight SHA-256 for provenance (T-D-9).
# - rand_chacha: seeded RNG for training (T-D-10).
# - clap: CLI for train_tcn binary (T-D-8).
# - anyhow: error handling in binary (train_tcn.rs).

[features]
default = []
# Enable candle Metal backend (Apple Silicon only).
metal = ["candle-core/metal", "candle-nn/metal"]
# Enable candle feature (CPU); required for TCN forward pass.
candle = ["dep:candle-core", "dep:candle-nn"]
# Gate the optional audit::Ledger field on TcnForecaster and the
# ForecastEmitted broadcast tee (T-D-12 / decomp §5A). The `audit` crate is
# already an unconditional dep (train_tcn bin uses it); this feature gates
# only the tick-emit code path in TcnForecaster.
audit-tick = []

# `train_tcn` bin and `metal_cpu_drift` test depend on the candle-only `tcn`
# module + `FeatureTensor = Tensor`. Without `--features candle`,
# `FeatureTensor` resolves to `Vec<f32>` and these consumers fail to
# compile. Mirror the cockpit-bin pattern: gate them at the cargo-target
# level so default `cargo build` / `cargo test` skip them and they only
# build with `--features candle`.
[[bin]]
name = "train_garch"
path = "src/bin/train_garch.rs"

[[bin]]
name = "vol_verdict"
path = "src/bin/vol_verdict.rs"

[[bin]]
name = "regime_verdict"
path = "src/bin/regime_verdict.rs"

[[bin]]
name = "train_tcn"
path = "src/bin/train_tcn.rs"
required-features = ["candle"]

[[bin]]
name = "forecast_distribution"
path = "src/bin/forecast_distribution.rs"
required-features = ["candle"]

[[bin]]
name = "recalibrate_sigma_train"
path = "src/bin/recalibrate_sigma_train.rs"
required-features = ["candle"]

[[bin]]
name = "train_patchtst"
path = "src/bin/train_patchtst.rs"
required-features = ["candle"]

[[bin]]
name = "sharpe_comparison"
path = "src/bin/sharpe_comparison.rs"

[[test]]
name = "metal_cpu_drift"
path = "tests/metal_cpu_drift.rs"
required-features = ["candle"]

# K5 golden-CLI snapshot (ADR-0034 § D9). Requires `candle` so the binary
# exists; uses `cargo run` internally.
[[test]]
name = "train_tcn_golden_cli"
path = "tests/train_tcn_golden_cli.rs"
required-features = ["candle"]

# T-D-N10 audit-emits integration tests.
[[test]]
name = "train_tcn_audit_emits"
path = "tests/train_tcn_audit_emits.rs"
required-features = ["candle"]

[[test]]
name = "train_tcn_no_audit_db_writes_nothing"
path = "tests/train_tcn_no_audit_db_writes_nothing.rs"
required-features = ["candle"]

# T-D-N5 read-only enforcement + help surface tests for recalibrate_sigma_train.
[[test]]
name = "recalibrate_sigma_train_readonly"
path = "tests/recalibrate_sigma_train_readonly.rs"
required-features = ["candle"]

# T-D-N5 field-invariance test (JSON overlay logic in isolation — no forward pass).
[[test]]
name = "recalibrate_sigma_train_field_invariance"
path = "tests/recalibrate_sigma_train_field_invariance.rs"

# T-D-N6 σ_train-not-in-safetensors invariant (ADR-0035 D4).
[[test]]
name = "sigma_train_not_in_safetensors"
path = "tests/sigma_train_not_in_safetensors.rs"
required-features = ["candle"]

# T-D-N13 σ_train-not-in-safetensors invariant for PatchTST (ADR-0035 D4 + ADR-0036 § D3).
[[test]]
name = "sigma_train_not_in_safetensors_patchtst"
path = "tests/sigma_train_not_in_safetensors_patchtst.rs"
required-features = ["candle"]

# T-D-N14 PatchTST CPU forward-pass byte-identity + Metal-vs-CPU drift < 1e-4 (K2).
[[test]]
name = "forward_determinism_patchtst"
path = "tests/forward_determinism_patchtst.rs"
required-features = ["candle"]

# T-D-N5 GARCH fit determinism (R11.4 / ADR-0038 § D3).
[[test]]
name = "garch_fit_determinism"
path = "tests/garch_fit_determinism.rs"

# T-D-N6 TCN byte-identity guard for vol ship (R11.7 / K-vol-3).
# NOTE: reuses the existing tcn_byte_identity.rs test file — same guard.
[[test]]
name = "tcn_byte_identity"
path = "tests/tcn_byte_identity.rs"

# T-D-N7 PatchTST byte-identity guard for vol ship (R11.8 / K-vol-3).
[[test]]
name = "patchtst_byte_identity"
path = "tests/patchtst_byte_identity.rs"

# T-D-N10 Parkinson target derivation closed-form accuracy check (ADR-0038 § D3 / T-AR-3).
[[test]]
name = "parkinson_target_derivation"
path = "tests/parkinson_target_derivation.rs"

# T-D-N13 V-verdict mutual exclusivity test (R11.5 / ADR-0038 § D1.b).
[[test]]
name = "vol_verdict_mutual_exclusivity"
path = "tests/vol_verdict_mutual_exclusivity.rs"

# T-D-E2 V-REG mutual exclusivity test (ADR-0049 § D4).
[[test]]
name = "vreg_mutual_exclusivity"
path = "tests/vreg_mutual_exclusivity.rs"

# T-D-N16 PatchTST overlay anchor-neutrality (K4); #[ignore]d — run manually at M-D end.
[[test]]
name = "patchtst_overlay_neutrality"
path = "tests/patchtst_overlay_neutrality.rs"
required-features = ["candle"]

[dependencies]
# Workspace siblings
trading_core = { path = "../core" }
replay-cache = { path = "../replay-cache" }
# Audit-DB sidecar for train_tcn --audit-db instrumentation (T-D-N10).
# Compiled in always; the Ledger is only opened at runtime when --audit-db
# is passed. Zero performance impact on normal training runs.
audit = { path = "../audit" }

# Async runtime for blocking audit writes in train_tcn's audit_writer helper.
tokio = { workspace = true, features = ["rt", "macros"] }

# Async trait
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Numerics
rust_decimal = { workspace = true }

# IDs
uuid = { workspace = true, features = ["serde", "v4"] }

# Time
time = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Data pipeline
polars = { workspace = true }
itertools = "0.14"

# Deep learning (optional; candle feature gate)
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }

# Checkpoint I/O
safetensors = "0.4"

# Hashing (provenance)
sha2 = { workspace = true }

# RNG (deterministic training)
rand = { workspace = true }
rand_chacha = { workspace = true }

# CLI (train_tcn binary)
anyhow = { workspace = true }
clap = { workspace = true }

# Config (train_tcn.toml)
toml = { workspace = true }

# Logging (train_tcn binary)
tracing-subscriber = { workspace = true }

# Temp dirs (sharpe_comparison binary)
tempfile = { workspace = true }

[dev-dependencies]
# tokio is already in [dependencies]; rt-multi-thread is added here for tests.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
rust_decimal_macros = { workspace = true }
proptest = { workspace = true }
# For T-D-N10 integration tests that open the audit.db directly without tokio.
rusqlite = { version = "0.32", features = ["bundled"] }
# For the no-audit-db walkdir assertion.
walkdir = "2"
# For T-D-N10 metadata JSON validation.
serde_json = { workspace = true }
