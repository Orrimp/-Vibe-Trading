mode = "research"   # research | paper ; "live" rejected in v0

[data.sources.binance]
ws_url   = "wss://stream.binance.com:9443/ws"
rest_url = "https://api.binance.com"

[data.historical]
# parquet_root is the root of the Binance data tree: the ReplayFeed resolves
# per-symbol subdirectories as <parquet_root>/<symbol>/<year>/<month>.parquet.
# e.g. ./data/binance/BTCUSDT/2023/01.parquet lives under ./data/binance.
parquet_root = "./data/binance"
# replay_fast = true emits bars as-fast-as-possible (no wallclock sleep).
# Ignored when replay_pace_ms is set.
# Set to false only if you need real-time paced replay (1m bar = 1 real minute)
# and replay_pace_ms is absent.
replay_fast  = true
# replay_pace_ms: sleep N ms between every emitted bar — the "middle gear" for
# the cockpit live view.  The SMA-50 strategy warms up after ~50 bars (≈ 1.5 s
# at 30 ms/bar); fills + PnL then arrive over a watchable timeline.
# The headless `trading` bin and backtests ignore this (they build their own
# ReplayFeed with pace_ms = None / fast = true for full speed).
# Set to a lower value (e.g. 5) for a faster cockpit demo; set to 0 to disable.
replay_pace_ms = 30

[data]
clock_skew_warn_ms = 2000
clock_skew_halt_ms = 10000

[strategies.sma_crossover]
enabled  = true
fast_len = 20
slow_len = 50

[risk]
per_symbol_exposure_cap = 0.40
# ⚠️  daily_loss_stop_pct / max_drawdown_stop_pct are NOT ENFORCED (bug-log #85).
# Both values are parsed and then read by NOTHING — there is no read site in the
# workspace and `KillSwitch`'s HaltReason enum has no variant for either, so no
# code path can act on them. Setting them does NOT arm a stop. They are left here
# because the enforcement seam exists and wiring is modest; until then, treat
# these two lines as intent, not protection. `per_symbol_exposure_cap` above IS
# enforced (entry gate on per-order notional).
daily_loss_stop_pct     = -5.0
max_drawdown_stop_pct   = -15.0

[risk.sizing]
fixed_fraction = 0.10

[backtest]
slippage_bps         = 2
taker_fee_bps        = 4
maker_fee_bps        = 2
initial_capital_usdt = 100000

[audit]
ledger_db_path                = "./data/audit/ledger.db"
reconciliation_tolerance_usdt = 0.01
# capacity of the broadcast tick bus; 0 disables (R7.1 / Q1=1024 default).
tick_bus_capacity = 1024

[kill_switch]
halt_file             = "./.halt"
heartbeat_timeout_ms  = 5000

[observability]
prometheus_listen = "0.0.0.0:9100"
# T901 / live-cockpit-unified Q4 — when false, the agent skips binding
# the listener and emits one `prometheus_listener_disabled` info line.
# Default: true (omit for the same behavior as pre-feature configs).
# prometheus_enabled = true

[cost]
budget_usd_month = 20

[bus]
bars_capacity  = 1024
ticks_capacity = 8192
fills_capacity = 1024

# Funding-rate poller (v1 T614).
# Default off — tests and research-mode backtests never hit Binance fapi.
# Set enabled = true in paper mode to activate hourly polling.
[funding]
enabled       = false
interval_secs = 3600
universe      = [
    "BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT",
    "ADAUSDT", "DOGEUSDT", "AVAXUSDT", "DOTUSDT", "LINKUSDT",
]

# Symbol universe — operator-gated USDT / USDC sets (v1.5b T1410, Q6).
# Default: USDT only (preserves v1.5a behaviour). Flip `usdc_enabled = true`
# to add the 10-symbol USDC mirror set (20 symbols total).
[universe]
usdt_enabled = true
usdc_enabled = false  # opt-in to USDC mirror set


# v2-llm-strategy v2.0.0 (T1929 / R12.1) — LLM subsystem.
# Foundation-only at v2.0.0 (Q1 = Option A); `enabled = false` keeps the
# subsystem off so a fresh checkout does not require any API keys. Flip
# `enabled = true` only after copying `config/agent.toml.local.example`
# to `config/agent.toml.local` and editing in real keys (per Q3 = C).
#
# Keys are NOT in this committed file — they live in
# `config/agent.toml.local` (git-ignored). See `docs/runbooks/llm-cost.md`
# and `docs/runbooks/llm-replay.md` for operator workflow.
[llm]
enabled              = true  # foundation-only at v2.0.0
default_provider     = "anthropic"
budget_usd_month     = 200.0
replay_cache_path    = "./data/llm-replay.db"

[llm.deep_think]
provider = "anthropic"
model    = "claude-opus-4-7"

[llm.quick_think]
provider = "anthropic"
model    = "claude-haiku-4-5-20251001"

[llm.providers.anthropic]
base_url = "https://api.anthropic.com/v1"
api_key = "api-key"

[llm.providers.openai]
base_url = "https://api.openai.com/v1"

[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"

[llm.providers.deepseek]
base_url = "https://api.deepseek.com/v1"

[llm.providers.ollama]
base_url = "http://localhost:11434"

# Pricing override map (empty by default — see crates/llm/src/pricing.rs
# base table for the hard-coded rate card). Operator can override any
# row via:
#   [llm.pricing.anthropic."claude-opus-4-7"]
#   input_usd        = "15.0"
#   output_usd       = "75.0"
#   cached_input_usd = "1.5"
[llm.pricing]

# v0.1.0 observation-only broadcast consumer (R7.2 / R4.3).
# Default false — stub never runs; v2.x production write path is bit-identical.
[reflection]
path = "./data/reflection/reflection.db"
channel_capacity = 1024
enable_writer = false
audit_tick_consumer_enabled = false
