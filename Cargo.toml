[workspace]
members = [
    "crates/core",
    "crates/data",
    "crates/features",
    "crates/llm",
    "crates/cost",
    "crates/risk",
    "crates/strategy",
    "crates/trader",
    "crates/exec",
    "crates/backtest",
    "crates/audit",
    "crates/ui",
    "crates/agent",
    "crates/reports",
    "crates/reflection",
    "crates/replay-cache",
    "crates/forecast",
]
resolver = "2"

# ── Build profiles ────────────────────────────────────────────────────────────
# cockpit-performance-and-input-responsiveness (2026-06-08).
#
# The cockpit renders through the CPU/software `tiny-skia` rasterizer
# (`crates/ui/Cargo.toml` iced features = ["tiny-skia", ...]) — chosen for
# snapshot-test determinism over GPU `wgpu`. At `opt-level = 0` (the dev
# default) that rasterization is brutally slow: a MEASURED per-frame render
# on the Lab/Charts screen was **707 ms** in dev vs **17 ms** in release
# — a **40× debug-tax** (see `spec/v1/cockpit-performance-and-input-responsiveness/`
# and `crates/ui/tests/render_timing_probe.rs`). That 40× IS the operator's
# "1–3 s per interaction" lag.
#
# Fix: optimize DEPENDENCIES (iced, iced_tiny_skia, tiny-skia, cosmic-text —
# all external/vendored packages) at `opt-level = 3` even in dev, while
# keeping the workspace's own crates at `opt-level = 0` so the operator's
# edit→compile loop stays fast. This is the canonical Rust pattern for
# GUI/rasterizer-heavy workspaces (deps do the per-frame pixel work; first-
# party code does not). After this, a dev `cargo run` renders at ~release
# speed without a release rebuild.
# ── Dev/test disk footprint (added 2026-08-19) ────────────────────────────────
# `cargo clippy/test --all-targets` links **339 integration-test binaries** across
# 17 crates, and cargo's default `debug = true` embeds a FULL copy of DWARF in
# each one. That is what grew `target/debug` to **155 GB** and filled a 460 GB
# disk (measured, not estimated).
#
# `line-tables-only` keeps the part this project actually uses — file:line in
# panics and test backtraces — and drops the variable/type tables that dominate
# the size. `unpacked` split-debuginfo leaves debug data in the .o files instead
# of copying it into every one of those 339 binaries.
#
# NEITHER affects the `release` profile, so anchored report runs, the measured
# 17-24 ms cockpit renders, and every number in `evidence/` are untouched. Both
# are reversible: delete these two lines and `cargo clean` to go back.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

# Release: the canonical interactive-run profile (operator runs
# `cargo run -p ui --release --bin cockpit_live`). Explicit so the contract
# is visible at the workspace root. `opt-level = 3` (the release default) is
# what produced the MEASURED 17–24 ms renders above.
[profile.release]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Trading Agent"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# These are enforced at crate level in core, risk, audit, exec, backtest
# but listed here as documentation of the policy.
pedantic = "warn"
all = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
tokio-stream = { version = "0.1" }
futures = { version = "0.3" }
async-trait = { version = "0.1" }

# Observability
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = { version = "0.24" }
metrics-exporter-prometheus = { version = "0.16" }

# Error handling
thiserror = { version = "2.0" }
anyhow = { version = "1.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "0.8" }
config = { version = "0.14" }

# Numerics
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = { version = "1.36" }

# String interning
smol_str = { version = "0.3", features = ["serde"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }

# Data
polars = { version = "0.46", features = ["parquet", "lazy"] }

# Random
rand = { version = "0.9" }
rand_chacha = { version = "0.9" }

# Parallelism (threshold_sweep + candle training paths)
rayon = { version = "1.10" }

# Minimal future executor — no executor-context thread-local, safe from rayon workers
pollster = { version = "0.3" }

# Testing
proptest = { version = "1.6" }
trybuild = { version = "1.0" }
insta = { version = "1.42" }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = { version = "3.14" }

# File watching
notify = { version = "8.0" }

# Networking
# cockpit-cross-platform D1: flip to rustls-tls so the Linux/Windows build
# needs no system OpenSSL (libssl-dev / vcpkg) — zero-setup cross-platform
# build. native-tls rejected: spawns a per-env libssl-dev carve-out on
# every new Linux box (the un-durable path per durable-over-quick rule).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# UUID
uuid = { version = "1.16", features = ["v4", "serde"] }

# Stream generators
async-stream = { version = "0.3" }

# Cancellation
tokio-util = { version = "0.7", features = ["rt"] }

# CLI argument parsing
clap = { version = "4.5.37", features = ["derive"] }

# Technical analysis
# kand 0.2.2 has a compile bug (Signal: Into<i64> not satisfied) — excluded.
# See spec/features/v0-paper-sma.md ## Deviations for details.
quantedge-ta = { version = "0.17.0" }

# Hash (for determinism checks)
sha2 = { version = "0.10.8" }
# Secret-pattern matching (v2-1-tracing-layer-redactor D-RED-1 / T-RED-D1)
regex = { version = "1" }
# Blake3 — high-performance hash for deterministic RNG sub-stream derivation
# (v5-latency-slippage-sim ADR-0043 § D2: faster than sha2 for ≤50 ns target).
blake3 = { version = "1.5" }

# Sync primitives
parking_lot = { version = "0.12.3" }

# HTTP mock server (dev-only — T613 mock REST integration test)
wiremock = { version = "0.6.2" }

# Yahoo Finance unofficial-API client (ADR-0040 / D2).
# Pinned at =4.1.0 for stability against Yahoo response-shape drift.
# Feature `default-features = false` so the `blocking` feature is not pulled into
# the async-only cockpit build (K10 mitigation). Optional dep — only active when
# `crates/data --features yahoo` or `--features yahoo-online` is requested.
yahoo_finance_api = { version = "=4.1.0", default-features = false }

# chart-fixture-line-clipping bug — backport iced master commit 76b32d4906
# (Jan 28, 2026) "Fix transformation of `canvas` primitives in `tiny_skia`"
# into our pinned iced 0.14.0. The fix lives in `vendor/iced_tiny_skia/`
# and only touches `src/layer.rs` and `src/lib.rs` (2 hunks total).
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
