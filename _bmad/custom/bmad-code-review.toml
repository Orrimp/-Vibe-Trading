# Team override for bmad-code-review (committed). Workflow-level surface —
# [workflow] namespace only (persistent_facts, activation_steps_*,
# on_complete). No role/principles/menu: those fields don't exist on a
# workflow customize.toml, only on an agent's.
#
# Source: tester folded from the legacy tester agent definition
# (BMAD-migration Phase 5a, docs/dev-notes/bmad-migration-plan-2026-07-24.md
# § 6). RETIRED at Phase 5c (2026-07-25): the agent file is archived at
# docs/archive/pre-bmad-agents/tester.md; this override + bmad-agent-dev.toml's
# harness menu are the live home of the split tester contract.
#
# *** FIDELITY NOTE (role-preserved-via-workflow, not clean) ***
# BMM has no dedicated QA/tester persona agent. bmad-code-review is a
# STATIC adversarial diff review (reads a git diff, reasons about it in
# three parallel review layers) — it does NOT itself run cargo test/build/
# clippy, evidence/anchors.toml verification, or a backtest, the way our
# tester agent does. That DYNAMIC gate-EXECUTION half of the tester's job
# is wired instead into bmad-agent-dev.toml's menu (RB/RT/RV/VA/BT) — "no
# QA persona -> driven by the dev persona" per the migration plan § 6. This
# file carries the review-DISCIPLINE half: the report-template contract,
# the anchor/spec-lint gates, and the verify-before-route rule. A related
# workflow, bmad-qa-generate-e2e-tests, is deliberately left un-overridden
# here (kept at BMAD stock) — the discipline below already lands on the two
# surfaces (this file + bmad-agent-dev.toml) that actually execute work;
# adding a third override for diminishing returns would fight the
# "sparse overrides only" design of this mechanism.

[workflow]

persistent_facts = [
  "file:{project-root}/docs/dev-notes/review-playbook.md",
  "file:{project-root}/.claude/skills/rust-test/templates/test-report.md",
  "file:{project-root}/_bmad-output/planning-artifacts/architecture.md",
  "START HERE: `bash scripts/review_prep.sh <story-key>` does the mechanical prep (finds the implementing commits, writes the code-only diff, prints the baseline gates and the triad legs). The playbook loaded above carries the layer-prompt contract, the known-and-owned routing table, the mandatory probes, and the close-out checklist — it is the difference between a 3-hour review and a 45-minute one. Do not re-derive any of it.",
  "KNOWN-AND-OWNED (route with a verified chain, NEVER re-report as a new finding): cross-symbol fill mispricing (bug-log #67) + the √8575 annualization rider + the inert drift axis (#68) + the inert portfolio_exposure_cap (#69) + the SIDE-BLIND exposure cap that silently rejects position-CLOSING orders (#71) + funding accrual that was cadence-blind (#72) and once-per-SYMBOL-BAR (#73, both code-FIXED 2026-08-04 but the anchored bodies still carry the old numbers) + the MN score/accrual channel collision (#75) + the inverted residual rank (#76) are owned by story 1-25; the PWSD window/target fidelity gap is owned by story 1-24. CONTAMINATED ANCHOR INVENTORY as of 2026-08-12: #86, #87, #88/#89, #90/#91, #92-#99, #100-#107, #108-#119. A reviewer's job on these is to verify whether THIS story's anchored artifacts consume the chain and state which rows — that grows 1-25's re-lock inventory. VERIFY the gating chain; never assume in either direction (a 2026-08-11 review proved the basis lane never enters the accrual block, and a 2026-08-12 one proved the BUYHOLD surface constructs no Order at all — mis-routing a clean surface into 1-25 is as wrong as missing a dirty one). Standing exemption: the advisor bakeoff gate (bakeoff/bootstrap.rs) resamples log-returns and never re-executes fills, so crowns/verdicts/ship-passive are independent of every contaminated research surface.",
  "MANDATORY PROBES on every review — TEN, each born from a real defect that shipped past a VERDICT->PASS. The canonical list with worked examples is review-playbook.md § 4; this is the index: axis-execution (is every swept/configured parameter actually executed, or only hashed/printed/stored? — #68); binding-limit (construct a scenario where each declared risk limit must bind; does it? — #69); vacuity (would each gate-named test go RED under the bug its name claims to catch? — #66, and four further instances since); skip-visibility (does any fixture/corpus-gated test self-skip green, uncounted? — #66); chain (does this story's anchored evidence consume a contaminated path? — #67); identity-forge (ENUMERATE every CLI flag reaching the fills or the hashed body and check each against BOTH the scenario name and the pairing guard — it has fired in FOUR consecutive stories, always on that story's own new axis); seed-collision (additive `base + i*CONST` derivations collide on anti-diagonals; must be splitmix-mixed — three instances); loop-scope (a rule inside a per-bar loop: what is the loop ITERATING? with multi-symbol merged bars, 'once per bar' and 'once per instant' differ, and the difference is invisible in every aggregate the report prints — #73); channel (does the test inject through the SAME channel production uses, and if not does the test channel move the measured quantity by itself? one field serving two meanings is a silent substitution — #74 in a test, #75 in production); supersession (did later work FALSIFY a conclusion this story froze — or SUPPLY the proof it lacked? both directions; records propagate forward automatically and backward never — #77 and the 2-15/2-18 harness backfills).",
  "BASELINE / GOLDEN-FILE AUTHORITY (bug-log #77 + its rider): a baseline regenerated from the code under test has NO independent authority over it and cannot disagree with it — regenerating is how you RECORD a change, never how you VERIFY one. Ask of every green baseline: was this file regenerated in the commit it is guarding? If yes it is documentation, not a gate. An assertion is a gate only when its expected value comes from somewhere the implementation cannot reach (hand-derived, spec-quoted, or read off the requirement). Worse, the visual harness AUTO-WRITES a missing baseline and returns Ok — deleting a baseline PNG is a silent accept. When a review's own patch touches a snapshot, account for each one individually and name the independently-derived literal that now guards it.",
  "Before any PASS verdict on a diff touching crates/strategy, crates/audit, crates/exec, crates/backtest, or report rendering: `bash scripts/verify_anchors.sh` must print ANCHORS PASS (119/119) — a FAIL routes back to the developer with the body diff, never silently continues (architecture.md AD-2).",
  "Before any PASS verdict: `python3 scripts/spec_lint.py` must exit 0 (quote the 'spec-lint: PASS' line). New violation categories or higher counts than the most recent audit dev-note block PASS; pre-existing baseline violations do not block but must be quoted as pre-existing debt.",
  "Verbatim-gate-re-run discipline: sub-agent PASS/FAIL claims and cached clippy runs both lie — independently re-run the gate yourself (force a fresh lint pass, e.g. touch a lib.rs to invalidate clippy's cache) before trusting or routing on a prior result. #[ignore]'d test failures are not gated by default and must not silently pass OR silently block — call them out explicitly.",
  "Only the tester/reviewer ticks a story's final acceptance-criteria rows, and only after the test verdict is PASS AND the anchor gate is PASS-or-N/A. If tasks arrive already ticked, re-verify each citation (file:line + test command + literal output line) before trusting it; un-tick and route back on any failure.",
]

on_complete = "Before presenting a PASS/REGRESSION finding, confirm both `bash scripts/verify_anchors.sh` (expect 119/119) and `python3 scripts/spec_lint.py` (expect PASS(0)) were actually run THIS session — not a remembered or cached result — whenever the reviewed diff touches crates/strategy, crates/audit, crates/exec, crates/backtest, crates/ui, or report rendering. Quote both literal result lines in the findings before syncing sprint status."
