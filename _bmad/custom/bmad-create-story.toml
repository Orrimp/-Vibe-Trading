# Team override for bmad-create-story (committed). Workflow-level surface —
# [workflow] namespace only (persistent_facts, activation_steps_*,
# on_complete). No role/principles/menu: those fields don't exist on a
# workflow customize.toml, only on an agent's. Arrays APPEND to the skill's
# own: `.claude/skills/bmad-create-story/customize.toml` keeps its
# `file:{project-root}/**/project-context.md` entry, and this file adds to it.
#
# Why this file exists (bug-log #216): `scripts/spec_lint.py` joins each story
# to its trace.toml row through the story's `- Trace:` line, and since #216 a
# story with no such line, two of them, or one in neither accepted form fails
# `trace-ref-unparsed` (an id with no row fails `trace-ref-dangling`). The
# stock template.md's `### References` block has no `- Trace:` line, and the
# pre-commit hook lints the WORKING TREE, so without the fact below a freshly
# created story would block every commit in the repo until someone added the
# line by hand. Until now authors copied it from a sibling story, which is how
# story 2-63's unparseable `(state=`in-progress` since 2026-11-10)` was born.

[workflow]

persistent_facts = [
  "TRACE-LINE CONTRACT (scripts/spec_lint.py, bug-log #216): every story file this workflow writes has EXACTLY ONE line that starts at column 0 with `- Trace:`, placed under `### References`, in one of two forms. FORM 1, the story has a trace.toml row: - Trace: `<id>` (state=`<state>`) — the id and the state each in single backticks and the `)` directly after the state's closing backtick; free text may follow the `)`, but never put words between the state and the `)` (`(state=`in-progress` since <date>)` does not parse). <id> is the exact `id` value of a [[req]] row in _bmad-output/planning-artifacts/trace.toml, prefix included (e.g. `REQ-LAB-RECIPE-HARNESS-V0-3-001`; add the row first if it does not exist yet), and <state> is that row's current `state=` value. FORM 2, the story has no row: - Trace: none — <reason> (the word none, a space, an em dash, then a non-empty reason). Never bold it (`- **Trace:**`), never write a bare id without backticks, never write a second one; an example quoted elsewhere in the story must be indented, even inside a fenced block, because the rule reads every column-0 line. After writing the story, run `python3 scripts/spec_lint.py`: a `trace-ref-unparsed` or `trace-ref-dangling` hit means the line is wrong.",
]
