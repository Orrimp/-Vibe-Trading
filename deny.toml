# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[output]
feature-depth = 1

[advisories]
# Deny crates with known security vulnerabilities
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = []

[licenses]
version = 2
# Allow a set of standard open-source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "BSL-1.0",
]
exceptions = []

[bans]
# Lint about multiple versions of the same crate; warn only for now
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Crates that must never be depended on
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
